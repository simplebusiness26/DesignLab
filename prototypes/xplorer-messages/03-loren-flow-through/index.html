<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Xplorer Messages — Loren Brichter / Flow Through</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--panel:#fff;--ink:#111;--muted:#767676;--line:#e7e7e3;--accent:#222;--soft:#eeeeea;--danger:#a33a32;--shadow:0 20px 60px rgba(0,0,0,.14);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{overscroll-behavior:none}body{margin:0;background:#deded9;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--ink)}button,input{font:inherit}
.phone{width:min(100%,430px);height:min(900px,calc(100dvh - 32px));background:var(--bg);border-radius:30px;overflow:hidden;position:relative;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08);touch-action:pan-y}
.app{height:100%;display:flex;flex-direction:column}.topbar{background:rgba(246,246,244,.97);backdrop-filter:blur(12px);padding:max(16px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);z-index:4}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:750}.headline{display:flex;align-items:center;justify-content:space-between;margin-top:2px}.title{font-size:27px;font-weight:780;letter-spacing:-.04em}.hint{font-size:11px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 5px;border-radius:10px;font-weight:730;cursor:pointer;position:relative}.tab[aria-selected="true"]{color:var(--ink)}.tab[aria-selected="true"]::after{content:"";position:absolute;left:20%;right:20%;bottom:2px;height:2px;border-radius:3px;background:var(--accent)}.demo{display:flex;gap:10px;margin-top:8px;overflow:auto}.demo button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:3px 1px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;cursor:pointer}
.viewport{flex:1;overflow:hidden;position:relative}.track{height:100%;display:flex;width:300%;transform:translateX(0);transition:transform .26s cubic-bezier(.2,.8,.2,1);will-change:transform}.pane{width:33.333333%;height:100%;overflow:auto;padding:8px 10px 18px;overscroll-behavior:contain}.row{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:11px;align-items:center;padding:13px 9px;border:0;background:transparent;border-bottom:1px solid var(--line);text-align:left;color:inherit;cursor:pointer}.row:active{transform:scale(.992)}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#e6e6e0;color:#484842;font-weight:800;position:relative}.avatar.board{border-radius:14px}.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#111;right:0;top:0;border:2px solid var(--bg)}.name{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:4px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread .preview{color:#333;font-weight:650}.meta{text-align:right;color:var(--muted);font-size:11px;align-self:start;padding-top:2px}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;background:#111;color:#fff;border-radius:999px;font-size:10px;font-weight:800;margin-top:7px}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:32px}.empty h2{margin:0;font-size:19px}.empty p{color:var(--muted);line-height:1.5;max-width:250px}.swipeHint{position:absolute;left:50%;bottom:10px;translate:-50% 12px;background:rgba(17,17,17,.9);color:white;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:700;opacity:0;transition:.18s;pointer-events:none;z-index:8}.swipeHint.show{opacity:1;translate:-50% 0}
.thread{position:absolute;inset:0;background:var(--panel);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:pan-y}.thread.open{transform:translateX(0)}.thread.dragging{transition:none}.threadhead{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 9px 9px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.98)}.iconbtn{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:12px;cursor:pointer;font-size:20px}.threadwho{text-align:center;min-width:0}.threadwho strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.threadwho span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.messages{flex:1;overflow:auto;padding:17px 13px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;background:#efefeb;border-radius:18px 18px 18px 6px;padding:10px 12px;line-height:1.4;font-size:14px;align-self:flex-start}.bubble.me{background:#222;color:white;border-radius:18px 18px 6px 18px;align-self:flex-end}.bubble.pending{opacity:.58}.bubble.failed{background:#fff4f2;color:#5d1f1b;border:1px solid #e9b5af}.status{align-self:flex-end;font-size:10px;color:var(--muted)}.status.error{color:var(--danger)}.status button{border:0;background:transparent;color:var(--danger);font-weight:800;padding:2px 4px;cursor:pointer}.composer{display:grid;grid-template-columns:1fr 46px;gap:8px;padding:9px 10px max(9px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.composer input{border:1px solid #d6d6d1;border-radius:18px;padding:11px 13px;outline:0}.composer input:focus{border-color:#888;box-shadow:0 0 0 3px rgba(0,0,0,.06)}.send{border:0;border-radius:50%;background:#222;color:white;font-weight:900;cursor:pointer}.fakekbd{height:0;background:#d7d7d3;overflow:hidden;transition:height .2s ease}.fakekbd.open{height:230px}.keys{height:100%;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-content:center;padding:9px}.key{height:35px;background:#fff;border-radius:6px;box-shadow:0 1px 1px rgba(0,0,0,.16)}.toast{position:absolute;left:50%;bottom:16px;translate:-50% 16px;background:#111;color:white;padding:8px 11px;border-radius:999px;font-size:10px;font-weight:700;opacity:0;transition:.18s;z-index:30}.toast.show{opacity:1;translate:-50% 0}
button:focus-visible,input:focus-visible{outline:3px solid rgba(0,0,0,.18);outline-offset:2px}
@media(max-width:480px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.reduced *{transition:none!important;animation:none!important}
</style>
</head>
<body>
<main class="phone" id="phone" aria-label="Xplorer Messages Loren Brichter UX prototype">
<div class="app">
<header class="topbar">
 <div class="eyebrow">Xplorer · UX prototype 3</div>
 <div class="headline"><div class="title">Messages</div><div class="hint">Swipe categories ↔</div></div>
 <div class="tabs" role="tablist" aria-label="Message categories">
  <button class="tab" role="tab" data-i="0" aria-selected="true">Friends</button>
  <button class="tab" role="tab" data-i="1" aria-selected="false">Managers</button>
  <button class="tab" role="tab" data-i="2" aria-selected="false">Boards</button>
 </div>
 <div class="demo"><button id="emptyToggle">Demo empty pane</button><button id="keyboardToggle">Demo keyboard</button><button id="motionToggle">Reduced motion</button></div>
</header>
<div class="viewport" id="viewport">
 <div class="track" id="track"><section class="pane" data-cat="friends"></section><section class="pane" data-cat="managers"></section><section class="pane" data-cat="boards"></section></div>
</div>
</div>
<section class="thread" id="thread" aria-label="Conversation thread">
 <header class="threadhead"><button class="iconbtn" id="back" aria-label="Back to messages">←</button><div class="threadwho"><strong id="threadName"></strong><span id="threadType"></span></div><button class="iconbtn" id="keyboardInThread" aria-label="Toggle keyboard demo">⌨</button></header>
 <div class="messages" id="messages"></div>
 <form class="composer" id="composer"><input id="messageInput" placeholder="Message…" autocomplete="off" aria-label="Message"><button class="send" aria-label="Send message">↑</button></form>
 <div class="fakekbd" id="fakekbd" aria-hidden="true"><div class="keys" id="keys"></div></div>
</section>
<div class="swipeHint" id="swipeHint">Swipe from the left edge to go back</div>
<div class="toast" id="toast" role="status"></div>
</main>
<script>
const cats=['friends','managers','boards'];
const data={friends:[{id:'maya',name:'Maya Chen',type:'Friend',initials:'MC',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yeah — I’ll meet you by the pier.']]},{id:'lewis',name:'Lewis',type:'Friend',initials:'L',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂'],['me','Told you it was worth it.']]},{id:'nina',name:'Nina Patel',type:'Friend',initials:'NP',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]}],managers:[{id:'harbour',name:'Harbour Coffee',type:'Manager',initials:'HC',preview:'Your table is held until 10:15',time:'Mon',unread:0,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]}],boards:[{id:'run',name:'Brighton Sunset Run',type:'Message Board',initials:'BR',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:5,msgs:[['them','Asha: meeting point moved to the arches'],['them','Tom: I’ll bring spare water.']]},{id:'film',name:'Outdoor Film Night',type:'Message Board',initials:'OF',preview:'Sam: gates open at 8',time:'Fri',unread:0,msgs:[['them','Sam: gates open at 8']]}]};
let index=0,current=null,emptyDemo=false,reduced=false,startX=0,startY=0,dragging=false,edgeStart=0,threadDragging=false,lastScroll={friends:0,managers:0,boards:0};
const track=document.getElementById('track'),viewport=document.getElementById('viewport'),thread=document.getElementById('thread'),messages=document.getElementById('messages'),input=document.getElementById('messageInput'),fakekbd=document.getElementById('fakekbd'),toast=document.getElementById('toast'),phone=document.getElementById('phone');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderPanes(){cats.forEach(cat=>{const pane=document.querySelector(`[data-cat="${cat}"]`);pane.innerHTML='';if(emptyDemo&&cats[index]===cat){pane.innerHTML='<div class="empty"><div><h2>Nothing here yet</h2><p>This pane is deliberately empty so you can test the transition and recovery without leaving Messages.</p></div></div>';return}data[cat].forEach(item=>{const row=document.createElement('button');row.className='row'+(item.unread?' unread':'');row.innerHTML=`<div class="avatar ${cat==='boards'?'board':''}">${esc(item.initials)}${item.unread?'<i class="dot" aria-hidden="true"></i>':''}</div><div><div class="name">${esc(item.name)}</div><div class="preview">${esc(item.preview)}</div></div><div class="meta">${esc(item.time)}${item.unread?`<div class="badge" aria-label="${item.unread} unread">${item.unread}</div>`:''}</div>`;row.onclick=()=>openThread(item);pane.appendChild(row)});requestAnimationFrame(()=>pane.scrollTop=lastScroll[cat]||0)})}
function go(i,announce=false){const pane=document.querySelector(`[data-cat="${cats[index]}"]`);if(pane)lastScroll[cats[index]]=pane.scrollTop;index=Math.max(0,Math.min(2,i));track.style.transform=`translateX(-${index*33.333333}%)`;document.querySelectorAll('.tab').forEach((b,j)=>b.setAttribute('aria-selected',String(j===index)));renderPanes();if(announce)showToast(cats[index][0].toUpperCase()+cats[index].slice(1))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(Number(b.dataset.i),true));
viewport.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;dragging=true;viewport.setPointerCapture?.(e.pointerId)});viewport.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){go(index+(dx<0?1:-1),true)}});
function openThread(item){const pane=document.querySelector(`[data-cat="${cats[index]}"]`);lastScroll[cats[index]]=pane.scrollTop;current=item;item.unread=0;document.getElementById('threadName').textContent=item.name;document.getElementById('threadType').textContent=item.type;renderMessages();thread.classList.add('open');thread.style.transform='translateX(0)';document.getElementById('swipeHint').classList.add('show');setTimeout(()=>document.getElementById('swipeHint').classList.remove('show'),1400)}
function closeThread(){thread.classList.remove('open','dragging');thread.style.transform='';fakekbd.classList.remove('open');renderPanes()}
thread.addEventListener('pointerdown',e=>{if(!thread.classList.contains('open')||e.clientX>38)return;edgeStart=e.clientX;threadDragging=true;thread.classList.add('dragging');thread.setPointerCapture?.(e.pointerId)});thread.addEventListener('pointermove',e=>{if(!threadDragging)return;const dx=Math.max(0,e.clientX-edgeStart);thread.style.transform=`translateX(${Math.min(dx,phone.clientWidth)}px)`});thread.addEventListener('pointerup',e=>{if(!threadDragging)return;threadDragging=false;thread.classList.remove('dragging');const dx=e.clientX-edgeStart;if(dx>85)closeThread();else thread.style.transform='translateX(0)'});
function renderMessages(){messages.innerHTML='';current.msgs.forEach((m,i)=>{const b=document.createElement('div');b.className='bubble '+(m[0]==='me'?'me ':'')+(m[2]||'');b.textContent=m[1];messages.appendChild(b);if(m[2]==='pending'){const s=document.createElement('div');s.className='status';s.textContent='Sending…';messages.appendChild(s)}if(m[2]==='failed'){const s=document.createElement('div');s.className='status error';s.innerHTML='Not sent · <button type="button">Retry</button>';s.querySelector('button').onclick=()=>retry(i);messages.appendChild(s)}});messages.scrollTop=messages.scrollHeight}
function retry(i){current.msgs[i][2]='pending';renderMessages();setTimeout(()=>{current.msgs[i][2]=null;current.preview=current.msgs[i][1];current.time='Now';renderMessages();showToast('Sent')},600)}
function submit(e){e.preventDefault();const text=input.value.trim();if(!text)return;const i=current.msgs.push(['me',text,'pending'])-1;input.value='';renderMessages();setTimeout(()=>{const fail=/fail/i.test(text);current.msgs[i][2]=fail?'failed':null;if(!fail){current.preview=text;current.time='Now'}renderMessages();if(!fail)showToast('Sent')},650)}
function toggleKeyboard(){fakekbd.classList.toggle('open');setTimeout(()=>messages.scrollTop=messages.scrollHeight,20)}
function showToast(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
for(let i=0;i<30;i++){const k=document.createElement('div');k.className='key';document.getElementById('keys').appendChild(k)}
document.getElementById('back').onclick=closeThread;document.getElementById('composer').onsubmit=submit;document.getElementById('keyboardInThread').onclick=toggleKeyboard;document.getElementById('keyboardToggle').onclick=()=>{if(!thread.classList.contains('open'))openThread(data[cats[index]][0]);toggleKeyboard()};document.getElementById('emptyToggle').onclick=e=>{emptyDemo=!emptyDemo;e.currentTarget.textContent=emptyDemo?'Show messages':'Demo empty pane';renderPanes()};document.getElementById('motionToggle').onclick=e=>{reduced=!reduced;phone.classList.toggle('reduced',reduced);e.currentTarget.textContent=reduced?'Motion reduced ✓':'Reduced motion';showToast(reduced?'Reduced motion on':'Reduced motion off')};input.addEventListener('focus',()=>setTimeout(()=>messages.scrollTop=messages.scrollHeight,80));renderPanes();go(0);
</script>
</body>
</html>
