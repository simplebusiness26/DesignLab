<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Round 2 — Thumbline</title><style>
:root{--bg:#f4f4f2;--ink:#0f1112;--muted:#73777b;--line:#d8dadb;--accent:#ff553d;--dark:#17191b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#cbcdd0;color:var(--ink);touch-action:pan-y}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 20px 70px #0003}.inbox{position:absolute;inset:0;display:flex;flex-direction:column;transition:.28s cubic-bezier(.22,.8,.2,1);transform:translateX(0)}.inbox.behind{transform:translateX(-22%);filter:brightness(.92)}.head{padding:max(14px,env(safe-area-inset-top)) 14px 7px;display:flex;align-items:end;justify-content:space-between}.head h1{margin:0;font-size:33px;letter-spacing:-.055em}.round{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}.unreadTotal{font-size:11px;color:var(--muted);padding-bottom:5px}.rail{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f7f7f5;position:sticky;top:0;z-index:3}.rail button{flex:1;border:0;background:transparent;padding:10px 5px;font-size:11px;font-weight:800;color:var(--muted);position:relative}.rail button.active{color:var(--ink)}.rail button.active:after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}.hint{font-size:9px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list{flex:1;overflow:auto;overscroll-behavior:contain}.rowWrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--dark)}.openAction{position:absolute;right:0;top:0;bottom:0;width:84px;color:white;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--accent)}.row{position:relative;z-index:2;width:100%;border:0;background:var(--bg);padding:12px 13px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;text-align:left;transition:transform .18s;touch-action:pan-y}.avatar{width:42px;height:42px;border-radius:50%;background:#d8d9d5;display:grid;place-items:center;font-weight:900;font-size:12px}.board .avatar{border-radius:10px;background:#d7dee4}.main{min-width:0}.line1{display:flex;gap:6px;align-items:center}.name{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.context{font-size:9px;color:var(--accent);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.right{text-align:right;color:var(--muted);font-size:9px}.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;margin:8px 0 0 auto}.boardError{margin:12px;border:1px solid #d78a80;background:#fff2ef;color:#8b3329;padding:10px;border-radius:8px;font-size:11px}.thread{position:absolute;inset:0;z-index:10;background:#fff;display:flex;flex-direction:column;transform:translateX(105%);box-shadow:-18px 0 40px #0002;transition:.28s cubic-bezier(.22,.8,.2,1);touch-action:pan-y}.thread.open{transform:none}.th{height:62px;padding:max(8px,env(safe-area-inset-top)) 10px 7px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line);background:#fffffff4;backdrop-filter:blur(12px)}.icon{border:0;background:transparent;width:42px;height:42px;font-size:22px}.who{text-align:center}.who b{font-size:14px;display:block}.who span{font-size:9px;color:var(--muted)}.msgs{flex:1;overflow:auto;padding:12px 11px 80px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}.bubble{max-width:78%;padding:9px 11px;border-radius:15px;background:#eceeed;font-size:13px;line-height:1.35;align-self:flex-start}.bubble.me{align-self:flex-end;background:var(--dark);color:#fff}.jump{position:absolute;right:12px;bottom:70px;z-index:11;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:8px 10px;font-size:10px;font-weight:850;display:none;box-shadow:0 5px 16px #0002}.jump.show{display:block}.blocked{margin:0 10px 7px;font-size:10px;color:#8b3329;background:#fff2ef;border:1px solid #e5aaa2;border-radius:8px;padding:9px}.composer{display:grid;grid-template-columns:1fr 44px;gap:7px;padding:7px 9px max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);transition:transform .2s}.composer input{border:0;background:#f0f1f0;border-radius:999px;padding:11px 13px;outline:0}.send{border:0;border-radius:50%;background:var(--accent);color:#fff;font-weight:950}.demo{position:absolute;left:50%;bottom:8px;translate:-50%;z-index:4;display:flex;gap:5px}.demo button{border:1px solid var(--line);background:#fffffff0;border-radius:999px;padding:6px 8px;font-size:9px;color:var(--muted);font-weight:800}@media(max-width:480px){body{background:var(--bg)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="phone" id="phone"><section class="inbox" id="inbox"><header class="head"><div><div class="round">Round 2 · Thumbline</div><h1>Messages</h1></div><div class="unreadTotal" id="total">8 unread</div></header><nav class="rail"><button class="active" data-view="all">All</button><button data-view="friends">Friends</button><button data-view="managers">Managers</button><button data-view="boards">Boards</button></nav><div class="hint"><span>Swipe views ↔</span><span>Swipe a row ← to reveal Open</span></div><div class="list" id="list"></div></section><section class="thread" id="thread"><header class="th"><button class="icon" id="back">‹</button><div class="who"><b id="who">Thread</b><span id="why">context</span></div><button class="icon" id="kbd">⌨</button></header><div class="msgs" id="msgs"></div><button class="jump" id="jump">↓ latest</button><div class="blocked" id="blocked" hidden>Sending is no longer permitted. Earlier messages remain here.</div><form class="composer" id="composer"><input id="input" placeholder="Message" autocomplete="off"><button class="send">↑</button></form></section><div class="demo"><button id="newMsg">New message while reading</button><button id="boardFail">Board error</button></div></main><script>
const rows=[{id:'maya',kind:'friend',name:'Maya Chen',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep — pier at seven.']]},{id:'nina',kind:'friend',name:'Nina Patel',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',kind:'friend',name:'Lewis',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',kind:'listing',name:'Harbour Coffee',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15']]},{id:'run',kind:'board',name:'Brighton Sunset Run',context:'Activity Club board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches']]},{id:'film',kind:'board',name:'Outdoor Film Night',context:'Link-up board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];const views=['all','friends','managers','boards'];let view='all',current=null,boardError=false,blocked=false;const list=document.getElementById('list'),thread=document.getElementById('thread'),inbox=document.getElementById('inbox'),msgs=document.getElementById('msgs'),jump=document.getElementById('jump'),input=document.getElementById('input');function initial(x){return x.name.split(/\s+/).map(s=>s[0]).join('').slice(0,2)}function visible(){return rows.filter(x=>view==='all'||(view==='friends'&&x.kind==='friend')||(view==='managers'&&x.kind==='listing')||(view==='boards'&&x.kind==='board'))}function render(){if(view==='boards'&&boardError){list.innerHTML='<div class="boardError"><b>Boards didn’t load.</b><br>Swipe back to any direct-message view; those are unaffected.</div>';return}list.innerHTML=visible().map(x=>`<div class="rowWrap"><div class="openAction">Open</div><button class="row ${x.kind==='board'?'board':''}" data-id="${x.id}"><div class="avatar">${initial(x)}</div><div class="main"><div class="line1"><span class="name">${x.name}</span><span class="context">${x.context}</span></div><div class="preview">${x.preview}</div></div><div class="right">${x.time}${x.unread?'<div class="dot"></div>':''}</div></button></div>`).join('');list.querySelectorAll('.row').forEach(row=>{let sx=0,dx=0;row.onclick=()=>open(rows.find(x=>x.id===row.dataset.id));row.addEventListener('pointerdown',e=>{sx=e.clientX;dx=0;row.setPointerCapture(e.pointerId)});row.addEventListener('pointermove',e=>{if(!sx)return;dx=Math.min(0,e.clientX-sx);if(Math.abs(dx)>8)row.style.transform=`translateX(${Math.max(-84,dx)}px)`});row.addEventListener('pointerup',e=>{if(dx<-50){row.style.transform='translateX(-84px)'}else{row.style.transform='';if(Math.abs(dx)<8)open(rows.find(x=>x.id===row.dataset.id))}sx=0})});document.getElementById('total').textContent=rows.reduce((s,x)=>s+x.unread,0)+' unread'}function setView(v){view=v;document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>setView(b.dataset.view));let psx=0;inbox.addEventListener('pointerdown',e=>{if(e.target.closest('.row'))return;psx=e.clientX});inbox.addEventListener('pointerup',e=>{if(!psx)return;const d=e.clientX-psx;if(Math.abs(d)>65){let i=views.indexOf(view);i+=d<0?1:-1;i=Math.max(0,Math.min(views.length-1,i));setView(views[i])}psx=0});function open(x){current=x;x.unread=0;document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;renderMsgs();inbox.classList.add('behind');thread.classList.add('open');setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,20)}function close(){thread.classList.remove('open');inbox.classList.remove('behind');render()}function renderMsgs(){msgs.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'');d.textContent=m[1];msgs.appendChild(d)});const near=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<60;if(near)msgs.scrollTop=msgs.scrollHeight}document.getElementById('back').onclick=close;let edgeStart=0;thread.addEventListener('pointerdown',e=>{if(e.clientX<28)edgeStart=e.clientX});thread.addEventListener('pointerup',e=>{if(edgeStart&&e.clientX-edgeStart>75)close();edgeStart=0});msgs.addEventListener('scroll',()=>{const near=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<65;jump.classList.toggle('show',!near)});jump.onclick=()=>{msgs.scrollTop=msgs.scrollHeight;jump.classList.remove('show')};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;current.msgs.push(['me',t]);current.preview=t;current.time='Now';input.value='';renderMsgs();msgs.scrollTop=msgs.scrollHeight};document.getElementById('kbd').onclick=()=>{document.getElementById('composer').style.transform='translateY(-180px)';setTimeout(()=>document.getElementById('composer').style.transform='',1100)};document.getElementById('newMsg').onclick=()=>{if(!current)open(rows[0]);msgs.scrollTop=0;current.msgs.push(['them','Quick update — I’m five minutes away.']);renderMsgs();jump.classList.add('show')};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;setView('boards')};render();
</script></body></html>
