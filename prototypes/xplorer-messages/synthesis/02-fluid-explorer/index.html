<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Synthesis B — Fluid Explorer</title><style>
:root{--bg:#f2efe8;--ink:#171816;--muted:#77756f;--line:#d3d0c8;--accent:#ef5e44;--accent2:#ffd9c8;--soft:#e0e8df;--panel:#fbf8f1;--dark:#1b1c1a;--red:#a74b3c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#cfd1ce;color:var(--ink);touch-action:pan-y}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 22px 70px #0003}.world{position:absolute;inset:0;display:flex;flex-direction:column;transition:.3s cubic-bezier(.16,.82,.2,1)}.world.behind{transform:translateX(-24%) scale(.975);filter:brightness(.9)}.head{padding:max(15px,env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;align-items:end}.round{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:950}.head h1{font-size:34px;letter-spacing:-.06em;margin:2px 0 0}.count{font-size:10px;color:var(--muted);padding-bottom:5px}.trackWrap{padding:3px 12px 10px}.track{position:relative;height:44px;border:1px solid var(--line);border-radius:999px;background:#faf9f5;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}.thumb{position:absolute;left:3px;top:3px;bottom:3px;width:calc(25% - 1.5px);border-radius:999px;background:var(--dark);transition:transform .26s cubic-bezier(.2,.85,.2,1)}.track button{position:relative;z-index:2;border:0;background:transparent;font-size:10px;color:var(--muted);font-weight:850}.track button.active{color:#fff}.status{padding:0 13px 8px;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted)}.status strong{color:var(--ink);font-size:10px}.viewport{flex:1;position:relative;overflow:hidden}.pages{height:100%;display:flex;width:400%;transition:transform .3s cubic-bezier(.16,.82,.2,1)}.page{width:25%;height:100%;overflow:auto;padding:0 11px 100px;overscroll-behavior:contain}.rowWrap{position:relative;overflow:hidden;border-radius:16px;margin-bottom:7px;background:var(--dark)}.action{position:absolute;right:0;top:0;bottom:0;width:92px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950}.row{position:relative;z-index:2;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;text-align:left;transition:transform .16s;touch-action:pan-y}.row:active{filter:brightness(.98)}.avatar{width:42px;height:42px;border-radius:50%;background:#e4ddd1;display:grid;place-items:center;font-size:11px;font-weight:900}.board .avatar{border-radius:11px;background:var(--soft)}.main{min-width:0}.nameLine{display:flex;gap:6px;align-items:center}.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.context{font-size:9px;color:var(--accent);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.right{text-align:right;font-size:9px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin:8px 0 0 auto}.gate{font-size:16px;margin-top:5px}.empty,.error{margin:10px 2px;padding:11px;border-radius:13px;font-size:11px}.empty{border:1px dashed var(--line);color:var(--muted)}.error{border:1px solid #df9c90;background:#fff2ee;color:#873729}.thread{position:absolute;inset:0;z-index:10;background:#fff;display:flex;flex-direction:column;transform:translateX(105%);transition:.3s cubic-bezier(.16,.82,.2,1);box-shadow:-20px 0 50px #0002;touch-action:pan-y}.thread.open{transform:none}.th{height:64px;padding:max(8px,env(safe-area-inset-top)) 9px 7px;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;border-bottom:1px solid var(--line);background:#ffffffee;backdrop-filter:blur(12px)}.icon{border:0;background:transparent;width:44px;height:44px;font-size:22px}.who{text-align:center}.who b{display:block;font-size:14px}.who span{font-size:9px;color:var(--muted)}.msgs{flex:1;overflow:auto;padding:13px 11px 86px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}.bubble{max-width:78%;padding:9px 11px;border-radius:15px;background:#eceeeb;align-self:flex-start;font-size:13px;line-height:1.35}.bubble.me{align-self:flex-end;background:var(--dark);color:#fff}.jump{position:absolute;right:12px;bottom:72px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:8px 10px;font-size:9px;font-weight:900;display:none;box-shadow:0 5px 16px #0002}.jump.show{display:block}.blocked{margin:0 10px 7px;border:1px solid #e4aaa0;background:#fff2ee;color:#873729;border-radius:10px;padding:8px;font-size:10px}.composer{display:grid;grid-template-columns:1fr 44px;gap:7px;padding:7px 9px max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);transition:transform .2s}.composer input{border:0;background:#f0f1ef;border-radius:999px;padding:11px 13px;outline:0}.send{border:0;border-radius:50%;background:var(--accent);color:#fff;font-weight:950}.demo{position:absolute;left:50%;bottom:8px;translate:-50%;z-index:4;display:flex;gap:5px}.demo button{border:1px solid var(--line);background:#fffffff0;border-radius:999px;padding:6px 8px;font-size:9px;color:var(--muted);font-weight:800}@media(max-width:480px){body{background:var(--bg)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="phone"><section class="world" id="world"><header class="head"><div><div class="round">Synthesis B · Fluid Explorer</div><h1>Messages</h1></div><div class="count" id="count">8 unread</div></header><div class="trackWrap"><nav class="track" id="track"><div class="thumb" id="thumb"></div><button class="active" data-i="0">All</button><button data-i="1">Friends</button><button data-i="2">Managers</button><button data-i="3">Boards</button></nav></div><div class="status"><strong id="statusTitle">Move through your inbox</strong><span id="statusMeta">swipe left or right</span></div><section class="viewport" id="viewport"><div class="pages" id="pages"><div class="page" data-page="0"></div><div class="page" data-page="1"></div><div class="page" data-page="2"></div><div class="page" data-page="3"></div></div></section></section><section class="thread" id="thread"><header class="th"><button class="icon" id="back">‹</button><div class="who"><b id="who">Thread</b><span id="why">context</span></div><button class="icon" id="kbd">⌨</button></header><div class="msgs" id="msgs"></div><button class="jump" id="jump">↓ latest</button><div class="blocked" id="blocked" hidden>Sending has ended. The earlier conversation remains readable.</div><form class="composer" id="composer"><input id="input" placeholder="Message" autocomplete="off"><button class="send">↑</button></form></section><div class="demo"><button id="incoming">New while reading</button><button id="boardFail">Board error</button><button id="permission">Permission</button></div></main><script>
const rows=[{id:'maya',kind:'friend',name:'Maya Chen',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep — pier at seven.']]},{id:'nina',kind:'friend',name:'Nina Patel',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',kind:'friend',name:'Lewis',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',kind:'listing',name:'Harbour Coffee',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15']]},{id:'run',kind:'board',name:'Brighton Sunset Run',context:'Activity Club board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches']]},{id:'film',kind:'board',name:'Outdoor Film Night',context:'Link-up board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];let page=0,current=null,boardError=false,blocked=false;const pages=document.getElementById('pages'),thumb=document.getElementById('thumb'),viewport=document.getElementById('viewport'),world=document.getElementById('world'),thread=document.getElementById('thread'),msgs=document.getElementById('msgs'),jump=document.getElementById('jump'),input=document.getElementById('input'),composer=document.getElementById('composer');const filters=[()=>rows,()=>rows.filter(x=>x.kind==='friend'),()=>rows.filter(x=>x.kind==='listing'),()=>rows.filter(x=>x.kind==='board')];function initials(n){return n.split(/\s+/).map(s=>s[0]).join('').slice(0,2)}function rowHtml(x){return `<div class="rowWrap"><div class="action">Open</div><button class="row ${x.kind==='board'?'board':''}" data-id="${x.id}"><div class="avatar">${initials(x.name)}</div><div class="main"><div class="nameLine"><span class="name">${x.name}</span><span class="context">${x.context}</span></div><div class="preview">${x.preview}</div></div><div class="right">${x.time}${x.kind==='board'?'<div class="gate">↗</div>':x.unread?'<div class="dot"></div>':''}</div></button></div>`}function renderPages(){document.querySelectorAll('.page').forEach((el,i)=>{if(i===3&&boardError){el.innerHTML='<div class="error"><b>Boards didn’t load.</b><br>The direct-message pages on the left are still working.</div>';return}const arr=filters[i]().slice().sort((a,b)=>b.unread-a.unread);el.innerHTML=arr.length?arr.map(rowHtml).join(''):'<div class="empty">Nothing here right now.</div>';el.querySelectorAll('.row').forEach(row=>bindRow(row))});document.getElementById('count').textContent=rows.reduce((s,x)=>s+x.unread,0)+' unread'}function bindRow(row){let sx=0,dx=0;const get=()=>rows.find(x=>x.id===row.dataset.id);row.addEventListener('pointerdown',e=>{sx=e.clientX;dx=0;row.setPointerCapture(e.pointerId)});row.addEventListener('pointermove',e=>{if(!sx)return;dx=Math.min(0,e.clientX-sx);if(Math.abs(dx)>8)row.style.transform=`translateX(${Math.max(-92,dx)}px)`});row.addEventListener('pointerup',()=>{if(dx<-58)row.style.transform='translateX(-92px)';else{row.style.transform='';if(Math.abs(dx)<8)open(get())}sx=0})}function setPage(i){page=Math.max(0,Math.min(3,i));pages.style.transform=`translateX(-${page*25}%)`;thumb.style.transform=`translateX(${page*100}%)`;document.querySelectorAll('.track button').forEach((b,j)=>b.classList.toggle('active',j===page));const titles=['Everything in one flow','Your direct friends','Listing conversations','Message-board doorways'];const metas=['swipe left or right','direct messages','manager context, not identity','separate board system'];document.getElementById('statusTitle').textContent=titles[page];document.getElementById('statusMeta').textContent=metas[page]}document.querySelectorAll('.track button').forEach(b=>b.onclick=()=>setPage(+b.dataset.i));let sx=0;viewport.addEventListener('pointerdown',e=>{if(!e.target.closest('.row'))sx=e.clientX});viewport.addEventListener('pointerup',e=>{if(!sx)return;const d=e.clientX-sx;if(Math.abs(d)>55)setPage(page+(d<0?1:-1));sx=0});function open(x){current=x;x.unread=0;blocked=false;syncPermission();document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;renderMsgs(true);world.classList.add('behind');thread.classList.add('open')}function close(){thread.classList.remove('open');world.classList.remove('behind');composer.style.transform='';renderPages()}function renderMsgs(force){msgs.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'');d.textContent=m[1];msgs.appendChild(d)});if(force)setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,0)}function syncPermission(){document.getElementById('blocked').hidden=!blocked;input.disabled=blocked;document.querySelector('.send').disabled=blocked}document.getElementById('back').onclick=close;let edge=0;thread.addEventListener('pointerdown',e=>{if(e.clientX<28)edge=e.clientX});thread.addEventListener('pointerup',e=>{if(edge&&e.clientX-edge>75)close();edge=0});msgs.addEventListener('scroll',()=>{jump.classList.toggle('show',msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight>65)});jump.onclick=()=>{msgs.scrollTop=msgs.scrollHeight;jump.classList.remove('show')};document.getElementById('kbd').onclick=()=>{composer.style.transform='translateY(-180px)';setTimeout(()=>composer.style.transform='',1100)};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;current.msgs.push(['me',t]);current.preview=t;current.time='Now';input.value='';renderMsgs(true)};document.getElementById('incoming').onclick=()=>{if(!current)open(rows[0]);msgs.scrollTop=0;current.msgs.push(['them','Quick update — I’m five minutes away.']);renderMsgs(false);jump.classList.add('show')};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;renderPages();setPage(3)};document.getElementById('permission').onclick=()=>{if(!current)open(rows[0]);blocked=!blocked;syncPermission()};renderPages();setPage(0);
</script></body></html>
