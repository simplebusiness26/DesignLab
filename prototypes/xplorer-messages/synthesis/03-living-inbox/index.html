<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Synthesis C — Living Inbox</title><style>
:root{--bg:#f5f2ea;--panel:#fffdf8;--ink:#20211f;--muted:#75766f;--line:#d9d8d1;--blue:#355fd4;--blue2:#e9edfb;--green:#46705d;--green2:#e2ece5;--gold:#e6c76e;--red:#a2483d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d7d7d2;color:var(--ink)}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 22px 70px #0002}.home{position:absolute;inset:0;display:flex;flex-direction:column;transition:.28s cubic-bezier(.2,.8,.2,1)}.home.behind{transform:translateX(-16%) scale(.985);filter:brightness(.94)}.head{padding:max(17px,env(safe-area-inset-top)) 15px 8px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:950}.top{display:flex;justify-content:space-between;align-items:end}.top h1{font-size:33px;letter-spacing:-.055em;margin:3px 0 0}.health{font-size:9px;color:var(--green);background:var(--green2);border:1px solid #b8ccbE;border-radius:999px;padding:6px 8px;font-weight:850}.views{padding:5px 12px 9px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.views button{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:9px 5px;font-size:9px;font-weight:850;color:var(--muted)}.views button b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}.views button.active{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 2px #355fd414}.views button.active span{color:var(--blue)}.logic{margin:0 12px 8px;padding:9px 10px;border:1px solid #c5d2c8;background:var(--green2);border-radius:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}.logic strong{font-size:11px}.logic span{font-size:9px;color:#587060}.list{flex:1;overflow:auto;padding:0 10px 100px;overscroll-behavior:contain}.group{margin-bottom:10px}.groupTitle{padding:8px 4px 5px;display:flex;justify-content:space-between;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.row{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:16px;margin-bottom:6px;padding:11px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;text-align:left;transition:.18s transform,.18s box-shadow}.row:active{transform:scale(.987)}.avatar{width:42px;height:42px;border-radius:13px;background:#ece5d7;display:grid;place-items:center;font-size:11px;font-weight:900}.friend .avatar{border-radius:50%}.board .avatar{background:var(--green2)}.main{min-width:0}.nameLine{display:flex;align-items:center;gap:6px}.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kind{font-size:8px;color:var(--blue);background:var(--blue2);border-radius:5px;padding:3px 5px;font-weight:850;white-space:nowrap}.board .kind{color:var(--green);background:var(--green2)}.context{font-size:9px;color:var(--green);font-weight:800;margin-top:2px}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.right{font-size:9px;color:var(--muted);text-align:right}.badge{display:inline-grid;place-items:center;background:var(--gold);color:var(--ink);min-width:20px;height:20px;padding:0 5px;border-radius:7px;font-weight:950;margin-top:6px}.gate{font-size:16px;margin-top:5px}.error{margin:8px 2px;border:1px solid #dfaaa2;background:#fff2ef;color:#84362e;border-radius:12px;padding:10px;font-size:11px}.thread{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;transform:translateX(105%);transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:-16px 0 40px #0002}.thread.open{transform:none}.th{padding:max(11px,env(safe-area-inset-top)) 10px 8px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line);background:#fffdf8ee;backdrop-filter:blur(12px)}.icon{border:1px solid var(--line);background:var(--panel);width:38px;height:38px;border-radius:12px}.who{text-align:center}.who b{display:block;font-size:14px}.who span{font-size:9px;color:var(--green)}.stateRail{display:flex;gap:5px;overflow:auto;padding:7px 9px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}.stateRail::-webkit-scrollbar{display:none}.stateRail span{font-size:8px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.stateRail .on{background:var(--blue2);border-color:#b8c4ed;color:var(--blue);font-weight:850}.msgs{flex:1;overflow:auto;padding:13px 11px 86px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}.bubble{max-width:79%;padding:9px 11px;border-radius:15px;background:#e9ebe8;align-self:flex-start;font-size:13px;line-height:1.35}.bubble.me{align-self:flex-end;background:var(--blue);color:#fff}.bubble.pending{opacity:.55}.jump{position:absolute;right:12px;bottom:72px;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:8px 10px;font-size:9px;font-weight:900;display:none}.jump.show{display:block}.blocked{margin:0 10px 7px;border:1px solid #dfaaa2;background:#fff2ef;color:#84362e;border-radius:10px;padding:8px;font-size:10px}.composer{display:grid;grid-template-columns:1fr 44px;gap:7px;padding:7px 9px max(8px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);transition:padding-bottom .2s}.composer input{border:1px solid var(--line);background:#f4f4f1;border-radius:999px;padding:11px 13px;outline:0}.send{border:0;border-radius:50%;background:var(--blue);color:#fff;font-weight:950}.demo{position:absolute;left:50%;bottom:8px;translate:-50%;z-index:4;display:flex;gap:5px}.demo button{border:1px solid var(--line);background:#fffdf8ee;border-radius:999px;padding:6px 8px;font-size:9px;color:var(--muted);font-weight:800}@media(max-width:480px){body{background:var(--bg)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="phone"><section class="home" id="home"><header class="head"><div class="eyebrow">Synthesis C · Living Inbox</div><div class="top"><h1>Messages</h1><div class="health">direct inbox healthy</div></div></header><nav class="views"><button class="active" data-view="all"><b>8</b><span>All</span></button><button data-view="friends"><b>3</b><span>Friends</span></button><button data-view="managers"><b>1</b><span>Managers</span></button><button data-view="boards"><b>4</b><span>Boards</span></button></nav><div class="logic"><strong id="logicTitle">Grouped by what the conversation is</strong><span id="logicMeta">unread first</span></div><section class="list" id="list"></section></section><section class="thread" id="thread"><header class="th"><button class="icon" id="back">←</button><div class="who"><b id="who">Thread</b><span id="why">context</span></div><button class="icon" id="kbd">⌨</button></header><div class="stateRail"><span class="on" id="sourceState">direct source</span><span id="readingState">at latest</span><span id="sendState">idle</span><span id="permissionState">permission ok</span></div><div class="msgs" id="msgs"></div><button class="jump" id="jump">↓ latest</button><div class="blocked" id="blocked" hidden>History stays readable. Sending is unavailable because permission is no longer valid.</div><form class="composer" id="composer"><input id="input" placeholder="Message…" autocomplete="off"><button class="send">↑</button></form></section><div class="demo"><button id="boardFail">Board error</button><button id="incoming">New while reading</button><button id="permission">Permission</button></div></main><script>
const rows=[{id:'maya',kind:'friend',name:'Maya Chen',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep — pier at seven.']]},{id:'nina',kind:'friend',name:'Nina Patel',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',kind:'friend',name:'Lewis',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',kind:'listing',name:'Harbour Coffee',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]},{id:'run',kind:'board',name:'Brighton Sunset Run',context:'Activity Club message board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches']]},{id:'film',kind:'board',name:'Outdoor Film Night',context:'Link-up message board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];let view='all',current=null,boardError=false,blocked=false;const list=document.getElementById('list'),home=document.getElementById('home'),thread=document.getElementById('thread'),msgs=document.getElementById('msgs'),jump=document.getElementById('jump'),input=document.getElementById('input'),composer=document.getElementById('composer');function initials(n){return n.split(/\s+/).map(s=>s[0]).join('').slice(0,2)}function visible(){return rows.filter(x=>view==='all'||(view==='friends'&&x.kind==='friend')||(view==='managers'&&x.kind==='listing')||(view==='boards'&&x.kind==='board')).sort((a,b)=>b.unread-a.unread)}function card(x){return `<button class="row ${x.kind}" data-id="${x.id}"><div class="avatar">${initials(x.name)}</div><div class="main"><div class="nameLine"><span class="name">${x.name}</span><span class="kind">${x.kind==='listing'?'listing context':x.kind}</span></div><div class="context">${x.context}</div><div class="preview">${x.preview}</div></div><div class="right">${x.time}${x.kind==='board'?'<div class="gate">↗</div>':x.unread?`<div class="badge">${x.unread}</div>`:''}</div></button>`}function render(){if(view==='boards'&&boardError){list.innerHTML='<div class="error"><b>Boards are unavailable right now.</b><br>The direct inbox is still healthy and usable.</div>';document.getElementById('logicTitle').textContent='Board source failed independently';document.getElementById('logicMeta').textContent='direct inbox unaffected';return}const arr=visible();if(view==='all'){const groups=[['Friends',arr.filter(x=>x.kind==='friend')],['Listing context',arr.filter(x=>x.kind==='listing')],['Message boards',arr.filter(x=>x.kind==='board')]];list.innerHTML=groups.filter(g=>g[1].length).map(([name,items])=>`<div class="group"><div class="groupTitle"><span>${name}</span><span>${items.reduce((s,x)=>s+x.unread,0)} unread</span></div>${items.map(card).join('')}</div>`).join('');document.getElementById('logicTitle').textContent='Grouped by what the conversation is';document.getElementById('logicMeta').textContent='unread first'}else{list.innerHTML=arr.map(card).join('');document.getElementById('logicTitle').textContent=view==='boards'?'Boards stay a separate destination':'One reusable direct-conversation pattern';document.getElementById('logicMeta').textContent=view==='boards'?'not DM data':'same permission rules'}list.querySelectorAll('.row').forEach(b=>b.onclick=()=>open(rows.find(x=>x.id===b.dataset.id)))}function setView(v){view=v;document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>setView(b.dataset.view));function open(x){current=x;x.unread=0;blocked=false;syncPermission();document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;document.getElementById('sourceState').textContent=x.kind==='board'?'board doorway':'direct source';renderMsgs(true);home.classList.add('behind');thread.classList.add('open')}function close(){thread.classList.remove('open');home.classList.remove('behind');composer.style.paddingBottom='';render()}function renderMsgs(force){msgs.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'')+(m[2]==='pending'?' pending':'');d.textContent=m[1];msgs.appendChild(d)});if(force)setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,0)}function syncPermission(){document.getElementById('blocked').hidden=!blocked;input.disabled=blocked;document.querySelector('.send').disabled=blocked;const p=document.getElementById('permissionState');p.textContent=blocked?'permission ended':'permission ok';p.classList.toggle('on',blocked)}document.getElementById('back').onclick=close;let edge=0;thread.addEventListener('pointerdown',e=>{if(e.clientX<26)edge=e.clientX});thread.addEventListener('pointerup',e=>{if(edge&&e.clientX-edge>70)close();edge=0});msgs.addEventListener('scroll',()=>{const near=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<60;jump.classList.toggle('show',!near);document.getElementById('readingState').textContent=near?'at latest':'reading history';document.getElementById('readingState').classList.toggle('on',!near)});jump.onclick=()=>{msgs.scrollTop=msgs.scrollHeight;jump.classList.remove('show')};document.getElementById('kbd').onclick=()=>{composer.style.paddingBottom='max(190px, env(safe-area-inset-bottom))';setTimeout(()=>composer.style.paddingBottom='',1100)};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;const m=['me',t,'pending'];current.msgs.push(m);input.value='';document.getElementById('sendState').textContent='sending';document.getElementById('sendState').classList.add('on');renderMsgs(true);setTimeout(()=>{m[2]=null;current.preview=t;current.time='Now';document.getElementById('sendState').textContent='idle';document.getElementById('sendState').classList.remove('on');renderMsgs(false)},450)};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;setView('boards')};document.getElementById('incoming').onclick=()=>{if(!current)open(rows[0]);msgs.scrollTop=0;current.msgs.push(['them','Quick update — I’m five minutes away.']);renderMsgs(false);jump.classList.add('show')};document.getElementById('permission').onclick=()=>{if(!current)open(rows[0]);blocked=!blocked;syncPermission()};render();
</script></body></html>
