<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Synthesis A — Warm Flow</title><style>
:root{--paper:#f6f0e4;--card:#fffaf1;--ink:#24221e;--muted:#756f66;--line:#d8cfbf;--sage:#dfe9df;--green:#3d6855;--sun:#f1cf70;--red:#a64f43;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d8d0c1;color:var(--ink)}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 22px 70px #0002}.inbox{position:absolute;inset:0;display:flex;flex-direction:column;transition:.28s cubic-bezier(.2,.8,.2,1)}.inbox.behind{transform:translateX(-18%) scale(.985);filter:brightness(.95)}.head{padding:max(18px,env(safe-area-inset-top)) 16px 7px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}h1{font-size:34px;letter-spacing:-.055em;margin:5px 0 2px}.sub{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 15px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{border:1.7px solid var(--ink);background:var(--card);padding:9px 12px;border-radius:16px 13px 17px 14px;box-shadow:2px 3px 0 #332f29;font-size:11px;font-weight:850;white-space:nowrap;cursor:pointer}.tabs button.active{background:var(--sun);transform:translateY(2px);box-shadow:1px 1px 0 #332f29}.contextBar{margin:0 15px 8px;border:1px solid #b9c9bb;background:var(--sage);border-radius:17px 14px 16px 13px;padding:9px 11px;display:flex;justify-content:space-between;gap:12px;align-items:center}.contextBar strong{font-size:12px}.contextBar span{font-size:10px;color:#58705f}.list{flex:1;overflow:auto;padding:4px 13px 100px;overscroll-behavior:contain}.wrap{position:relative;margin-bottom:9px}.openAction{position:absolute;inset:0 0 0 auto;width:76px;border-radius:18px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:10px}.row{position:relative;z-index:2;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:22px 17px 20px 15px;padding:12px 12px 12px 62px;min-height:72px;text-align:left;box-shadow:0 4px 0 #cbbfac;transition:transform .18s;touch-action:pan-y}.avatar{position:absolute;left:11px;top:12px;width:40px;height:40px;border:1.8px solid var(--ink);border-radius:48% 52% 45% 55%;display:grid;place-items:center;background:#eadca8;font-size:11px;font-weight:900}.board .avatar{border-radius:12px 16px 11px 15px;background:#d6e2db}.name{font-size:14px;font-weight:900;padding-right:45px}.meta{font-size:10px;color:var(--green);font-weight:800;margin-top:2px}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.time{position:absolute;right:12px;top:12px;font-size:9px;color:var(--muted)}.badge{position:absolute;right:12px;bottom:12px;min-width:20px;height:20px;padding:0 5px;border:1.6px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--sun);font-size:9px;font-weight:900}.door{position:absolute;right:12px;bottom:11px;font-size:17px}.error{margin:8px 2px;border:1.5px dashed var(--red);background:#fff5f1;color:#813b33;border-radius:15px;padding:10px;font-size:11px}.thread{position:absolute;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column;transform:translateX(105%);transition:.3s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 45px #0002}.thread.open{transform:none}.th{padding:max(12px,env(safe-area-inset-top)) 11px 8px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.icon{border:1.6px solid var(--ink);background:var(--card);width:40px;height:40px;border-radius:14px 12px 15px 12px;box-shadow:1.5px 2px 0 #332f29;font-weight:900}.who{text-align:center}.who b{display:block;font-size:14px}.who span{display:block;font-size:9px;color:var(--green);font-weight:800}.msgs{flex:1;overflow:auto;padding:12px 13px 90px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}.bubble{max-width:80%;padding:10px 12px;border:1.4px solid var(--line);background:var(--card);border-radius:18px 17px 18px 12px;align-self:flex-start;font-size:13px;line-height:1.35}.bubble.me{align-self:flex-end;background:var(--sage);border-color:#b7c8ba;border-radius:17px 18px 12px 18px}.jump{position:absolute;right:12px;bottom:70px;border:0;border-radius:999px;background:var(--green);color:#fff;padding:8px 10px;font-size:9px;font-weight:900;display:none}.jump.show{display:block}.blocked{margin:0 11px 7px;border:1.4px dashed var(--red);background:#fff5f1;color:#813b33;border-radius:14px;padding:9px;font-size:10px}.composer{display:grid;grid-template-columns:1fr 48px;gap:7px;padding:7px 10px max(9px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);transition:padding-bottom .2s}.composer input{border:1.7px solid var(--ink);background:var(--card);border-radius:16px 13px 17px 13px;padding:11px 12px;outline:0}.send{border:1.7px solid var(--ink);background:var(--sun);border-radius:16px 13px 17px 13px;box-shadow:1.5px 2px 0 #332f29;font-weight:900}.demo{position:absolute;left:50%;bottom:9px;translate:-50%;z-index:4;display:flex;gap:5px}.demo button{border:1px solid var(--line);background:#fffaf1eb;border-radius:999px;padding:6px 8px;font-size:9px;color:var(--muted);font-weight:800}@media(max-width:480px){body{background:var(--paper)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="phone"><section class="inbox" id="inbox"><header class="head"><div class="eyebrow">Synthesis A · Warm Flow</div><h1>Messages</h1><div class="sub">People, places and plans — calm, clear, alive.</div></header><nav class="tabs"><button class="active" data-view="all">All</button><button data-view="friends">Friends</button><button data-view="managers">Managers</button><button data-view="boards">Boards</button></nav><div class="contextBar"><strong id="contextTitle">8 unread across your world</strong><span id="contextMeta">unread first · context preserved</span></div><div class="list" id="list"></div></section><section class="thread" id="thread"><header class="th"><button class="icon" id="back">←</button><div class="who"><b id="who">Conversation</b><span id="why">Friend</span></div><button class="icon" id="kbd">⌨</button></header><div class="msgs" id="msgs"></div><button class="jump" id="jump">↓ latest</button><div class="blocked" id="blocked" hidden>Sending is no longer available, but the conversation history stays here.</div><form class="composer" id="composer"><input id="input" placeholder="Write something…" autocomplete="off"><button class="send">↑</button></form></section><div class="demo"><button id="boardFail">Board error</button><button id="permission">Permission ended</button><button id="incoming">New while reading</button></div></main><script>
const rows=[{id:'maya',kind:'friend',name:'Maya Chen',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep — pier at seven.']]},{id:'nina',kind:'friend',name:'Nina Patel',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',kind:'friend',name:'Lewis',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',kind:'listing',name:'Harbour Coffee',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]},{id:'run',kind:'board',name:'Brighton Sunset Run',context:'Activity Club message board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches']]},{id:'film',kind:'board',name:'Outdoor Film Night',context:'Link-up message board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];const views=['all','friends','managers','boards'];let view='all',current=null,boardError=false,blocked=false;const list=document.getElementById('list'),thread=document.getElementById('thread'),inbox=document.getElementById('inbox'),msgs=document.getElementById('msgs'),jump=document.getElementById('jump'),input=document.getElementById('input'),composer=document.getElementById('composer');function initials(n){return n.split(/\s+/).map(s=>s[0]).join('').slice(0,2)}function visible(){return rows.filter(x=>view==='all'||(view==='friends'&&x.kind==='friend')||(view==='managers'&&x.kind==='listing')||(view==='boards'&&x.kind==='board')).sort((a,b)=>b.unread-a.unread)}function render(){if(view==='boards'&&boardError){list.innerHTML='<div class="error"><b>Message boards couldn’t load.</b><br>Friends and Manager conversations are still available in their own views.</div>';return}list.innerHTML=visible().map(x=>`<div class="wrap"><div class="openAction">Open</div><button class="row ${x.kind==='board'?'board':''}" data-id="${x.id}"><div class="avatar">${initials(x.name)}</div><div class="name">${x.name}</div><div class="meta">${x.context}</div><div class="preview">${x.preview}</div><div class="time">${x.time}</div>${x.kind==='board'?'<div class="door">↗</div>':x.unread?`<div class="badge">${x.unread}</div>`:''}</button></div>`).join('');list.querySelectorAll('.row').forEach(row=>{let sx=0,dx=0;const get=()=>rows.find(x=>x.id===row.dataset.id);row.onclick=()=>open(get());row.addEventListener('pointerdown',e=>{sx=e.clientX;dx=0;row.setPointerCapture(e.pointerId)});row.addEventListener('pointermove',e=>{if(!sx)return;dx=Math.min(0,e.clientX-sx);if(Math.abs(dx)>8)row.style.transform=`translateX(${Math.max(-76,dx)}px)`});row.addEventListener('pointerup',()=>{if(dx<-48)row.style.transform='translateX(-76px)';else{row.style.transform='';if(Math.abs(dx)<8)open(get())}sx=0})});const unread=visible().reduce((s,x)=>s+x.unread,0);document.getElementById('contextTitle').textContent=view==='boards'?'Boards are doorways, not DMs':unread?`${unread} unread ${unread===1?'message':'messages'}`:'All caught up';document.getElementById('contextMeta').textContent=view==='boards'?'separate board system':'unread first · context preserved'}function setView(v){view=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));let swipeStart=0;inbox.addEventListener('pointerdown',e=>{if(!e.target.closest('.row'))swipeStart=e.clientX});inbox.addEventListener('pointerup',e=>{if(!swipeStart)return;const d=e.clientX-swipeStart;if(Math.abs(d)>65){let i=views.indexOf(view);i=Math.max(0,Math.min(views.length-1,i+(d<0?1:-1)));setView(views[i])}swipeStart=0});function open(x){current=x;x.unread=0;blocked=false;syncPermission();document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;renderMsgs(true);inbox.classList.add('behind');thread.classList.add('open')}function close(){thread.classList.remove('open');inbox.classList.remove('behind');composer.style.paddingBottom='';render()}function renderMsgs(forceBottom=false){msgs.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'');d.textContent=m[1];msgs.appendChild(d)});if(forceBottom)setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,0)}function syncPermission(){document.getElementById('blocked').hidden=!blocked;input.disabled=blocked;document.querySelector('.send').disabled=blocked}document.getElementById('back').onclick=close;let edge=0;thread.addEventListener('pointerdown',e=>{if(e.clientX<26)edge=e.clientX});thread.addEventListener('pointerup',e=>{if(edge&&e.clientX-edge>70)close();edge=0});msgs.addEventListener('scroll',()=>{const near=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<60;jump.classList.toggle('show',!near)});jump.onclick=()=>{msgs.scrollTop=msgs.scrollHeight;jump.classList.remove('show')};document.getElementById('kbd').onclick=()=>{composer.style.paddingBottom='max(190px, env(safe-area-inset-bottom))';setTimeout(()=>composer.style.paddingBottom='',1100)};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;current.msgs.push(['me',t]);current.preview=t;current.time='Now';input.value='';renderMsgs(true)};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;setView('boards')};document.getElementById('permission').onclick=()=>{if(!current)open(rows[0]);blocked=!blocked;syncPermission()};document.getElementById('incoming').onclick=()=>{if(!current)open(rows[0]);msgs.scrollTop=0;current.msgs.push(['them','Quick update — I’m five minutes away.']);renderMsgs(false);jump.classList.add('show')};render();
</script></body></html>
