<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Xplorer Messages — Christian Selig / Native Power Inbox</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--panel:#fff;--ink:#111114;--muted:#6e6e73;--line:#d9d9df;--accent:#0a66c2;--soft:#e9f2fb;--danger:#c7342f;--shadow:0 22px 65px rgba(0,0,0,.15);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#d8d8dd;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}button,input{font:inherit}
.phone{width:min(100%,430px);height:min(900px,calc(100dvh - 32px));background:var(--bg);border-radius:32px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.08);box-shadow:var(--shadow)}
.app{height:100%;display:flex;flex-direction:column}.nav{padding:max(14px,env(safe-area-inset-top)) 14px 10px;background:rgba(248,248,250,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.08);z-index:4}.navline{display:grid;grid-template-columns:52px 1fr 52px;align-items:center}.eyebrow{grid-column:2;text-align:center;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.title{grid-column:2;text-align:center;font-size:18px;font-weight:760;margin-top:2px}.more{grid-column:3;grid-row:1/3;justify-self:end;border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px;font-size:22px;cursor:pointer;color:var(--accent)}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:10px;padding:2px;background:#dfdfe5;border-radius:9px}.segment button{border:0;background:transparent;border-radius:7px;padding:7px 5px;font-size:12px;font-weight:650;color:#4d4d52;cursor:pointer}.segment button[aria-selected="true"]{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.demo{display:flex;gap:8px;overflow:auto;margin-top:9px}.demo button{white-space:nowrap;border:0;background:transparent;color:var(--accent);padding:4px 2px;font-size:10px;font-weight:650;cursor:pointer}
.list{flex:1;overflow:auto;padding:10px 12px 24px;overscroll-behavior:contain}.group{background:var(--panel);border-radius:14px;overflow:hidden}.rowWrap{position:relative;overflow:hidden;background:var(--panel)}.swipeAction{position:absolute;inset:0 0 0 auto;width:92px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:760}.row{position:relative;width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;border:0;background:var(--panel);padding:12px;text-align:left;color:inherit;cursor:pointer;transform:translateX(0);transition:transform .18s ease}.rowWrap+.rowWrap .row{border-top:1px solid var(--line)}.compact .row{padding:8px 12px}.compact .avatar{width:42px;height:42px}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#e7e7ec;color:#3e3e43;font-weight:780;position:relative;transition:.18s}.avatar.board{border-radius:13px}.dot{position:absolute;right:0;top:0;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid white}.name{font-size:15px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread .name,.unread .preview{font-weight:760;color:#27272a}.meta{text-align:right;align-self:start;color:var(--muted);font-size:11px;padding-top:2px}.badge{margin-top:6px;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:780}
.empty,.loading{min-height:100%;display:grid;place-items:center;text-align:center;padding:36px}.empty h2{margin:0;font-size:19px}.empty p{color:var(--muted);line-height:1.5;max-width:260px}.spinner{width:28px;height:28px;border:3px solid #d4d4d8;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:auto}.loading p{color:var(--muted);font-size:13px}@keyframes spin{to{transform:rotate(360deg)}}
.sheetBackdrop{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:20;opacity:0;pointer-events:none;transition:.18s}.sheetBackdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-radius:18px;padding:8px;transform:translateY(calc(100% + 20px));transition:.22s cubic-bezier(.2,.8,.2,1);box-shadow:0 18px 50px rgba(0,0,0,.22)}.sheetBackdrop.open .sheet{transform:translateY(0)}.sheet h2{font-size:13px;margin:6px 8px 8px;color:var(--muted)}.sheet button{width:100%;border:0;background:#f6f6f8;border-radius:12px;padding:12px;text-align:left;margin-top:5px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between}.sheet button[aria-pressed="true"]{color:var(--accent);font-weight:720}.sheet small{display:block;color:var(--muted);padding:9px 8px 5px;line-height:1.4}
.thread{position:absolute;inset:0;background:#fff;z-index:10;display:none;flex-direction:column}.thread.open{display:flex}.threadHead{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);background:rgba(250,250,252,.96);backdrop-filter:blur(18px)}.back,.kbd{border:0;background:transparent;min-width:44px;min-height:44px;color:var(--accent);cursor:pointer;border-radius:12px}.back{font-size:24px}.threadWho{text-align:center;min-width:0}.threadWho strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.threadWho span{font-size:10px;color:var(--muted)}.messages{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;padding:10px 12px;border-radius:18px;line-height:1.4;font-size:14px;background:#e9e9ed;align-self:flex-start}.bubble.me{background:#1685f8;color:white;align-self:flex-end}.bubble.long{max-width:88%}.bubble.pending{opacity:.58}.bubble.failed{background:#fff3f2;color:#5b1b18;border:1px solid #efb5b0}.status{font-size:10px;color:var(--muted);align-self:flex-end}.status.error{color:var(--danger)}.status button{border:0;background:transparent;color:var(--danger);font-weight:760;padding:2px 4px;cursor:pointer}.composer{display:grid;grid-template-columns:1fr 44px;gap:8px;padding:8px 10px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fafafa}.composer input{border:1px solid #cfcfd5;border-radius:18px;padding:10px 12px;background:#fff;outline:0}.composer input:focus{border-color:#88b9e9;box-shadow:0 0 0 3px rgba(10,102,194,.10)}.send{border:0;border-radius:50%;background:var(--accent);color:white;font-weight:900;cursor:pointer}.fakekbd{height:0;background:#d2d2d7;overflow:hidden;transition:height .2s ease}.fakekbd.open{height:230px}.keys{height:100%;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-content:center;padding:9px}.key{height:35px;background:#fff;border-radius:6px;box-shadow:0 1px 1px rgba(0,0,0,.14)}
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,16px);background:#2c2c2e;color:white;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}button:focus-visible,input:focus-visible{outline:3px solid rgba(10,102,194,.22);outline-offset:2px}
.reduced *{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}@media(max-width:480px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}}
</style>
</head>
<body>
<main class="phone" id="phone" aria-label="Xplorer Messages Christian Selig UX prototype">
<div class="app">
<header class="nav">
 <div class="navline"><div class="eyebrow">Xplorer · UX prototype 4</div><div class="title">Messages</div><button class="more" id="more" aria-label="Message display options">•••</button></div>
 <div class="segment" role="tablist" aria-label="Message categories"><button role="tab" data-cat="friends" aria-selected="true">Friends</button><button role="tab" data-cat="managers" aria-selected="false">Managers</button><button role="tab" data-cat="boards" aria-selected="false">Boards</button></div>
 <div class="demo"><button id="emptyToggle">Demo empty</button><button id="loadingToggle">Demo loading</button><button id="keyboardToggle">Demo keyboard</button><button id="motionToggle">Reduced motion</button></div>
</header>
<section class="list" id="list" aria-live="polite"></section>
</div>
<section class="thread" id="thread" aria-label="Conversation thread">
 <header class="threadHead"><button class="back" id="back" aria-label="Back to messages">‹</button><div class="threadWho"><strong id="threadName"></strong><span id="threadType"></span></div><button class="kbd" id="keyboardInThread" aria-label="Toggle keyboard demo">⌨</button></header>
 <div class="messages" id="messages"></div>
 <form class="composer" id="composer"><input id="messageInput" placeholder="Message…" autocomplete="off" aria-label="Message"><button class="send" aria-label="Send message">↑</button></form>
 <div class="fakekbd" id="fakekbd" aria-hidden="true"><div class="keys" id="keys"></div></div>
</section>
<div class="sheetBackdrop" id="sheetBackdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="Message display options"><h2>Display options</h2><button id="unreadOnly" aria-pressed="false"><span>Unread only</span><span>Off</span></button><button id="compactMode" aria-pressed="false"><span>Compact rows</span><span>Off</span></button><small>These options only reorganise what is already in your inbox. They do not change or create message types.</small><button id="closeSheet"><span>Done</span><span>✓</span></button></section></div>
<div class="toast" id="toast" role="status"></div>
</main>
<script>
const data={friends:[{id:'maya',name:'Maya Chen',type:'Friend',initials:'MC',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yeah — I’ll meet you by the pier.'],['them','Perfect. I’m leaving now, so I might be five minutes early. No rush — I’ll wait by the entrance if I get there first.','long']]},{id:'lewis',name:'Lewis',type:'Friend',initials:'L',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂'],['me','Told you it was worth it.']]},{id:'nina',name:'Nina Patel',type:'Friend',initials:'NP',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]}],managers:[{id:'harbour',name:'Harbour Coffee',type:'Manager',initials:'HC',preview:'Your table is held until 10:15',time:'Mon',unread:0,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]}],boards:[{id:'run',name:'Brighton Sunset Run',type:'Message Board',initials:'BR',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:5,msgs:[['them','Asha: meeting point moved to the arches'],['them','Tom: I’ll bring spare water.']]},{id:'film',name:'Outdoor Film Night',type:'Message Board',initials:'OF',preview:'Sam: gates open at 8',time:'Fri',unread:0,msgs:[['them','Sam: gates open at 8']]}]};
let category='friends',current=null,unreadOnly=false,compact=false,emptyDemo=false,loading=false,reduced=false,lastScroll={friends:0,managers:0,boards:0},swipeStart=null;
const phone=document.getElementById('phone'),list=document.getElementById('list'),thread=document.getElementById('thread'),messages=document.getElementById('messages'),input=document.getElementById('messageInput'),fakekbd=document.getElementById('fakekbd'),sheet=document.getElementById('sheetBackdrop'),toast=document.getElementById('toast');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function visibleRows(){let rows=data[category].slice();if(unreadOnly)rows=rows.filter(x=>x.unread>0);return emptyDemo?[]:rows}
function renderList(){list.classList.toggle('compact',compact);if(loading){list.innerHTML='<div class="loading"><div><div class="spinner"></div><p>Loading conversations…</p></div></div>';return}const rows=visibleRows();if(!rows.length){list.innerHTML=`<div class="empty"><div><h2>${unreadOnly?'You’re caught up':'Nothing here yet'}</h2><p>${unreadOnly?'There are no unread conversations in this category. Turn off Unread only to see everything.':'This category has no conversations to show right now.'}</p></div></div>`;return}const group=document.createElement('div');group.className='group';rows.forEach(item=>{const wrap=document.createElement('div');wrap.className='rowWrap';wrap.innerHTML='<div class="swipeAction">Open</div>';const row=document.createElement('button');row.className='row'+(item.unread?' unread':'');row.innerHTML=`<div class="avatar ${category==='boards'?'board':''}">${esc(item.initials)}${item.unread?'<i class="dot" aria-hidden="true"></i>':''}</div><div><div class="name">${esc(item.name)}</div><div class="preview">${esc(item.preview)}</div></div><div class="meta">${esc(item.time)}${item.unread?`<div class="badge" aria-label="${item.unread} unread">${item.unread}</div>`:''}</div>`;row.addEventListener('click',()=>openThread(item));row.addEventListener('pointerdown',e=>{swipeStart={x:e.clientX,y:e.clientY,row,item}});row.addEventListener('pointermove',e=>{if(!swipeStart||swipeStart.row!==row)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(dx>0&&Math.abs(dx)>Math.abs(dy)){row.style.transform=`translateX(${Math.min(dx,92)}px)`}});row.addEventListener('pointerup',e=>{if(!swipeStart||swipeStart.row!==row)return;const dx=e.clientX-swipeStart.x;row.style.transform='';swipeStart=null;if(dx>68)openThread(item)});row.addEventListener('pointercancel',()=>{row.style.transform='';swipeStart=null});wrap.appendChild(row);group.appendChild(wrap)});list.innerHTML='';list.appendChild(group);requestAnimationFrame(()=>list.scrollTop=lastScroll[category]||0)}
function setCategory(next){lastScroll[category]=list.scrollTop;category=next;document.querySelectorAll('.segment button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.cat===category)));renderList()}
document.querySelectorAll('.segment button').forEach(b=>b.addEventListener('click',()=>setCategory(b.dataset.cat)));
function openThread(item){lastScroll[category]=list.scrollTop;current=item;item.unread=0;document.getElementById('threadName').textContent=item.name;document.getElementById('threadType').textContent=item.type;renderMessages();thread.classList.add('open');setTimeout(()=>messages.scrollTop=messages.scrollHeight,0)}
function closeThread(){thread.classList.remove('open');fakekbd.classList.remove('open');renderList()}
function renderMessages(){messages.innerHTML='';current.msgs.forEach((m,i)=>{const b=document.createElement('div');b.className='bubble '+(m[0]==='me'?'me ':'')+(m[2]||'');b.textContent=m[1];if(m[2]==='long')b.classList.add('long');messages.appendChild(b);if(m[2]==='pending'){const s=document.createElement('div');s.className='status';s.textContent='Sending…';messages.appendChild(s)}if(m[2]==='failed'){const s=document.createElement('div');s.className='status error';s.innerHTML='Not sent · <button type="button">Retry</button>';s.querySelector('button').addEventListener('click',()=>retry(i));messages.appendChild(s)}});messages.scrollTop=messages.scrollHeight}
function retry(i){current.msgs[i][2]='pending';renderMessages();setTimeout(()=>{current.msgs[i][2]=null;current.preview=current.msgs[i][1];current.time='Now';renderMessages();showToast('Sent')},600)}
function submit(e){e.preventDefault();const text=input.value.trim();if(!text)return;const i=current.msgs.push(['me',text,'pending'])-1;input.value='';renderMessages();setTimeout(()=>{const fail=/fail/i.test(text);current.msgs[i][2]=fail?'failed':null;if(!fail){current.preview=text;current.time='Now'}renderMessages();if(!fail)showToast('Sent')},650)}
function toggleKeyboard(){fakekbd.classList.toggle('open');setTimeout(()=>messages.scrollTop=messages.scrollHeight,20)}
function showToast(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000)}
function syncSheet(){const u=document.getElementById('unreadOnly'),c=document.getElementById('compactMode');u.setAttribute('aria-pressed',String(unreadOnly));u.lastElementChild.textContent=unreadOnly?'On':'Off';c.setAttribute('aria-pressed',String(compact));c.lastElementChild.textContent=compact?'On':'Off'}
for(let i=0;i<30;i++){const k=document.createElement('div');k.className='key';document.getElementById('keys').appendChild(k)}
document.getElementById('more').onclick=()=>{syncSheet();sheet.classList.add('open')};document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('open');sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('open')});document.getElementById('unreadOnly').onclick=()=>{unreadOnly=!unreadOnly;syncSheet();renderList()};document.getElementById('compactMode').onclick=()=>{compact=!compact;syncSheet();renderList()};document.getElementById('back').onclick=closeThread;document.getElementById('composer').onsubmit=submit;document.getElementById('keyboardInThread').onclick=toggleKeyboard;document.getElementById('keyboardToggle').onclick=()=>{if(!thread.classList.contains('open'))openThread(visibleRows()[0]||data[category][0]);toggleKeyboard()};document.getElementById('emptyToggle').onclick=e=>{emptyDemo=!emptyDemo;e.currentTarget.textContent=emptyDemo?'Show messages':'Demo empty';renderList()};document.getElementById('loadingToggle').onclick=e=>{loading=!loading;e.currentTarget.textContent=loading?'Stop loading demo':'Demo loading';renderList()};document.getElementById('motionToggle').onclick=e=>{reduced=!reduced;phone.classList.toggle('reduced',reduced);e.currentTarget.textContent=reduced?'Motion reduced ✓':'Reduced motion';showToast(reduced?'Reduced motion on':'Reduced motion off')};input.addEventListener('focus',()=>setTimeout(()=>messages.scrollTop=messages.scrollHeight,80));renderList();
</script>
</body>
</html>
