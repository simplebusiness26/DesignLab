<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Round 2 — Native Power Inbox</title><style>
:root{--bg:#f2f2f7;--panel:#fff;--ink:#111114;--muted:#72727a;--blue:#0a84ff;--green:#30a46c;--red:#ff453a;--line:#d9d9df;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d8d8dd;color:var(--ink)}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 20px 70px #0002}.app{height:100%;display:flex;flex-direction:column}.largeHead{padding:max(12px,env(safe-area-inset-top)) 16px 8px;background:#f2f2f7e8;backdrop-filter:blur(20px)}.bar{display:flex;justify-content:space-between;align-items:center}.round{font-size:9px;color:var(--muted);font-weight:700}.more{border:0;background:#e2e2e8;width:34px;height:34px;border-radius:50%;font-weight:900}.largeHead h1{font-size:34px;letter-spacing:-.045em;margin:7px 0 0}.seg{margin:5px 12px 9px;background:#e3e3e8;border-radius:9px;padding:2px;display:grid;grid-template-columns:repeat(4,1fr)}.seg button{border:0;background:transparent;border-radius:7px;padding:7px 4px;font-size:10px;font-weight:700;color:#55555c}.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}.power{margin:0 12px 9px;display:flex;gap:7px}.power button{border:0;border-radius:999px;background:#e4e4ea;color:#4a4a52;padding:7px 10px;font-size:10px;font-weight:700}.power button.on{background:#d8ebff;color:#0563b8}.list{flex:1;overflow:auto;padding:0 0 110px}.section{background:#fff;margin:0 12px 14px;border-radius:13px;overflow:hidden}.sectionTitle{padding:9px 13px 6px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.row{width:100%;border:0;background:#fff;display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px 12px;text-align:left;position:relative}.row:after{content:"";position:absolute;left:68px;right:0;bottom:0;height:.5px;background:var(--line)}.row:last-child:after{display:none}.row.compact{padding-top:7px;padding-bottom:7px}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d5e8ff,#b6d6fb);font-size:12px;font-weight:800}.board .avatar{border-radius:12px;background:linear-gradient(145deg,#e6dcff,#cdb9ff)}.main{min-width:0}.name{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.context{font-size:10px;color:var(--green);margin-top:2px;font-weight:650}.preview{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{font-size:9px;color:var(--muted);text-align:right}.badge{display:inline-grid;place-items:center;background:var(--blue);color:#fff;border-radius:999px;min-width:19px;height:19px;padding:0 5px;font-size:9px;font-weight:800;margin-top:7px}.chev{font-size:17px;color:#b4b4ba;margin-top:8px}.error{margin:0 12px 12px;background:#fff;border-radius:13px;padding:11px 12px;color:#8f2f29;font-size:11px}.sheetBack{position:absolute;inset:0;background:#0003;z-index:20;display:none}.sheetBack.open{display:block}.sheet{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));background:#f8f8fb;border-radius:20px;padding:10px;box-shadow:0 14px 45px #0003}.grab{width:36px;height:5px;border-radius:99px;background:#c8c8ce;margin:0 auto 10px}.sheet h2{font-size:16px;margin:0 0 8px;padding:0 5px}.option{width:100%;border:0;background:#fff;border-radius:12px;padding:12px;text-align:left;margin-bottom:7px;display:flex;justify-content:space-between;font-size:13px}.thread{position:absolute;inset:0;z-index:10;background:#f2f2f7;display:flex;flex-direction:column;transform:translateX(105%);transition:.28s cubic-bezier(.25,.8,.25,1)}.thread.open{transform:none}.th{padding:max(9px,env(safe-area-inset-top)) 10px 8px;background:#f7f7fae9;backdrop-filter:blur(20px);display:grid;grid-template-columns:58px 1fr 58px;align-items:center;border-bottom:.5px solid var(--line)}.back{border:0;background:transparent;color:var(--blue);font-size:14px;text-align:left}.who{text-align:center}.who b{display:block;font-size:14px}.who span{font-size:9px;color:var(--muted)}.msgs{flex:1;overflow:auto;padding:13px 11px 90px;display:flex;flex-direction:column;gap:7px}.bubble{max-width:78%;padding:9px 11px;border-radius:18px;background:#e5e5ea;font-size:13px;line-height:1.35;align-self:flex-start}.bubble.me{align-self:flex-end;background:var(--blue);color:#fff}.status{align-self:flex-end;font-size:9px;color:var(--muted);margin-top:-4px}.blocked{margin:0 10px 7px;background:#fff;border-radius:11px;padding:9px;color:#8f2f29;font-size:10px}.composer{padding:7px 9px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:38px 1fr 40px;gap:7px;align-items:center;background:#f7f7fa;border-top:.5px solid var(--line)}.plus{border:0;width:34px;height:34px;border-radius:50%;background:#e1e1e7;color:#555;font-size:18px}.composer input{border:1px solid #cacbd0;border-radius:999px;padding:10px 12px;background:#fff;outline:0}.send{border:0;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900}.demo{position:absolute;left:50%;bottom:9px;translate:-50%;z-index:4;display:flex;gap:5px}.demo button{border:0;background:#ffffffeb;border-radius:999px;padding:7px 9px;font-size:9px;color:var(--muted);font-weight:700;box-shadow:0 1px 4px #0001}@media(max-width:480px){body{background:var(--bg)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="phone"><div class="app"><header class="largeHead"><div class="bar"><span class="round">Round 2 · Native Power Inbox</span><button class="more" id="more">•••</button></div><h1>Messages</h1></header><nav class="seg"><button class="active" data-view="all">All</button><button data-view="friends">Friends</button><button data-view="managers">Managers</button><button data-view="boards">Boards</button></nav><div class="power"><button id="unreadOnly">Unread only</button><button id="density">Comfortable</button></div><section class="list" id="list"></section></div><section class="thread" id="thread"><header class="th"><button class="back" id="back">‹ Messages</button><div class="who"><b id="who">Thread</b><span id="why">context</span></div><span></span></header><div class="msgs" id="msgs"></div><div class="blocked" id="blocked" hidden>Sending isn’t available anymore, but your existing conversation stays readable.</div><form class="composer" id="composer"><button class="plus" type="button" aria-label="Composer accessory">+</button><input id="input" placeholder="Message" autocomplete="off"><button class="send">↑</button></form></section><div class="sheetBack" id="sheetBack"><div class="sheet"><div class="grab"></div><h2>View options</h2><button class="option" id="sheetUnread"><span>Unread only</span><b id="checkUnread">Off</b></button><button class="option" id="sheetDensity"><span>Message density</span><b id="checkDensity">Comfortable</b></button><button class="option" id="closeSheet"><span>Done</span><b>✓</b></button></div></div><div class="demo"><button id="boardFail">Board load error</button><button id="permission">Permission ended</button></div></main><script>
const rows=[{id:'maya',kind:'friend',name:'Maya Chen',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep — pier at seven.']]},{id:'nina',kind:'friend',name:'Nina Patel',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',kind:'friend',name:'Lewis',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',kind:'listing',name:'Harbour Coffee',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]},{id:'run',kind:'board',name:'Brighton Sunset Run',context:'Activity Club message board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches']]},{id:'film',kind:'board',name:'Outdoor Film Night',context:'Link-up message board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];let view='all',unread=false,compact=false,current=null,boardError=false,blocked=false;const list=document.getElementById('list'),thread=document.getElementById('thread'),msgs=document.getElementById('msgs'),input=document.getElementById('input'),sheet=document.getElementById('sheetBack');function initials(x){return x.name.split(/\s+/).map(s=>s[0]).join('').slice(0,2)}function visible(){return rows.filter(x=>(view==='all'||(view==='friends'&&x.kind==='friend')||(view==='managers'&&x.kind==='listing')||(view==='boards'&&x.kind==='board'))&&(!unread||x.unread>0))}function card(x){return `<button class="row ${compact?'compact ':''}${x.kind==='board'?'board':''}" data-id="${x.id}"><div class="avatar">${initials(x)}</div><div class="main"><div class="name">${x.name}</div><div class="context">${x.context}</div><div class="preview">${x.preview}</div></div><div class="right">${x.time}${x.kind==='board'?'<div class="chev">›</div>':x.unread?`<div class="badge">${x.unread}</div>`:''}</div></button>`}function render(){if(view==='boards'&&boardError){list.innerHTML='<div class="error"><b>Message Boards couldn’t load.</b><br>Your direct conversations are still available in All, Friends and Managers.</div>';return}const a=visible();if(view==='all'){const direct=a.filter(x=>x.kind!=='board'),boards=a.filter(x=>x.kind==='board');list.innerHTML=`<div class="section"><div class="sectionTitle">Conversations</div>${direct.map(card).join('')}</div>${boards.length?`<div class="section"><div class="sectionTitle">Message boards</div>${boards.map(card).join('')}</div>`:''}`}else list.innerHTML=`<div class="section">${a.map(card).join('')||'<div style="padding:22px;text-align:center;color:#777;font-size:12px">Nothing here right now.</div>'}</div>`;list.querySelectorAll('.row').forEach(b=>b.onclick=()=>open(rows.find(x=>x.id===b.dataset.id)))}document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('active',x===b));render()});function setUnread(v){unread=v;document.getElementById('unreadOnly').classList.toggle('on',v);document.getElementById('checkUnread').textContent=v?'On':'Off';render()}function setDensity(v){compact=v;document.getElementById('density').textContent=v?'Compact':'Comfortable';document.getElementById('density').classList.toggle('on',v);document.getElementById('checkDensity').textContent=v?'Compact':'Comfortable';render()}document.getElementById('unreadOnly').onclick=()=>setUnread(!unread);document.getElementById('density').onclick=()=>setDensity(!compact);document.getElementById('more').onclick=()=>sheet.classList.add('open');document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('open');document.getElementById('sheetUnread').onclick=()=>setUnread(!unread);document.getElementById('sheetDensity').onclick=()=>setDensity(!compact);sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};function open(x){current=x;x.unread=0;document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;blocked=false;syncBlocked();renderMsgs();thread.classList.add('open');setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,20)}function renderMsgs(){msgs.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'');d.textContent=m[1];msgs.appendChild(d)});msgs.scrollTop=msgs.scrollHeight}function syncBlocked(){document.getElementById('blocked').hidden=!blocked;input.disabled=blocked;document.querySelector('.send').disabled=blocked}document.getElementById('back').onclick=()=>{thread.classList.remove('open');render()};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;current.msgs.push(['me',t]);current.preview=t;current.time='Now';input.value='';renderMsgs();const s=document.createElement('div');s.className='status';s.textContent='Delivered';msgs.appendChild(s)};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;view='boards';document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('active',x.dataset.view==='boards'));render()};document.getElementById('permission').onclick=()=>{if(!current)open(rows[0]);blocked=!blocked;syncBlocked()};render();
</script></body></html>
