<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Round 2 — Message System</title><style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#111317;--muted:#69707c;--line:#dfe3e9;--blue:#315efb;--blue2:#e9eeff;--green:#1c8a5a;--red:#c44343;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#dfe3ea;color:var(--ink)}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 20px 70px #0002}.app{height:100%;display:flex;flex-direction:column}.head{padding:max(17px,env(safe-area-inset-top)) 15px 8px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:900}.top{display:flex;align-items:end;justify-content:space-between;gap:10px}.top h1{margin:3px 0 0;font-size:31px;letter-spacing:-.05em}.statePill{font-size:10px;color:var(--green);background:#e7f6ef;border:1px solid #b9dfcf;padding:6px 8px;border-radius:999px;font-weight:800}.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px 12px 10px}.cell{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:9px 7px;text-align:left;min-height:60px;cursor:pointer}.cell b{display:block;font-size:16px}.cell span{display:block;color:var(--muted);font-size:9px;margin-top:3px}.cell.active{border-color:var(--blue);box-shadow:0 0 0 2px #315efb18;background:var(--blue2)}.rule{display:flex;gap:7px;align-items:center;margin:0 12px 9px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}.rule .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.rule strong{font-size:11px}.rule span{font-size:10px;color:var(--muted);margin-left:auto}.list{flex:1;overflow:auto;padding:0 10px 100px}.group{margin-bottom:10px}.groupTitle{padding:8px 4px 5px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:850;color:var(--muted);display:flex;justify-content:space-between}.row{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;margin-bottom:6px;padding:11px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;text-align:left;cursor:pointer;transition:.18s transform,.18s border-color}.row:active{transform:scale(.985)}.avatar{width:42px;height:42px;border-radius:12px;background:#edf0f5;display:grid;place-items:center;font-size:12px;font-weight:900}.main{min-width:0}.name{font-size:14px;font-weight:850;display:flex;gap:6px;align-items:center}.type{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);background:var(--blue2);padding:3px 5px;border-radius:5px}.context{font-size:10px;color:var(--green);font-weight:750;margin-top:2px}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.right{text-align:right;font-size:9px;color:var(--muted)}.badge{margin-top:7px;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:var(--blue);color:#fff;font-weight:900}.boardGate{border-style:dashed}.boardGate .type{color:#6b48b8;background:#f0ebff}.error{margin:5px 2px 10px;border:1px solid #efb8b8;background:#fff1f1;color:#8b3030;border-radius:12px;padding:10px;font-size:11px}.thread{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;transform:translateX(105%);transition:.25s}.thread.open{transform:none}.th{padding:max(13px,env(safe-area-inset-top)) 12px 9px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line);background:#ffffffeb;backdrop-filter:blur(14px)}.icon{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:11px}.who{text-align:center}.who b{display:block;font-size:14px}.who span{font-size:9px;color:var(--muted)}.stateRail{display:flex;gap:5px;padding:7px 10px;overflow:auto;background:#fff;border-bottom:1px solid var(--line)}.stateRail span{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:var(--muted);white-space:nowrap}.stateRail .on{border-color:var(--blue);color:var(--blue);background:var(--blue2);font-weight:800}.messages{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:80%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 11px;font-size:13px;line-height:1.35;align-self:flex-start}.bubble.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue)}.bubble.pending{opacity:.55}.sendError{align-self:flex-end;font-size:9px;color:var(--red);margin-top:-4px}.blocked{margin:0 10px 7px;padding:9px 10px;border:1px solid #efb8b8;background:#fff1f1;color:#8b3030;border-radius:11px;font-size:10px}.composer{padding:8px 10px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 46px;gap:7px;background:#fff;border-top:1px solid var(--line)}.composer input{border:1px solid var(--line);border-radius:12px;padding:11px;background:#f7f8fa;outline:0}.send{border:0;border-radius:12px;background:var(--blue);color:white;font-weight:900}.demo{position:absolute;left:50%;bottom:10px;translate:-50% 0;z-index:4;display:flex;gap:6px}.demo button{border:1px solid var(--line);background:#fffffff0;border-radius:999px;padding:7px 9px;font-size:9px;color:var(--muted);font-weight:750}@media(max-width:480px){body{background:var(--bg)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="phone"><div class="app"><header class="head"><div class="eyebrow">Round 2 · Message System</div><div class="top"><h1>Messages</h1><div class="statePill">direct inbox healthy</div></div></header><nav class="matrix" aria-label="Views"><button class="cell active" data-view="all"><b>8</b><span>All unread</span></button><button class="cell" data-view="friends"><b>3</b><span>Friends</span></button><button class="cell" data-view="managers"><b>1</b><span>Managers</span></button><button class="cell" data-view="boards"><b>4</b><span>Boards</span></button></nav><div class="rule"><i class="dot"></i><strong id="ruleTitle">One system · grouped by context</strong><span id="ruleMeta">unread first</span></div><section class="list" id="list"></section></div><section class="thread" id="thread"><header class="th"><button class="icon" id="back">←</button><div class="who"><b id="who">Thread</b><span id="why">context</span></div><button class="icon" id="kbd">⌨</button></header><div class="stateRail"><span class="on" id="available">available</span><span id="reading">at latest</span><span id="sending">idle</span><span id="permissionState">permission ok</span></div><div class="messages" id="messages"></div><div class="blocked" id="blocked" hidden>History remains readable. Sending is disabled because permission is no longer valid.</div><form class="composer" id="composer"><input id="input" placeholder="Message…" autocomplete="off"><button class="send">↑</button></form></section><div class="demo"><button id="boardFail">Toggle board source error</button><button id="permission">Permission state</button></div></main><script>
const rows=[{id:'maya',kind:'friend',name:'Maya Chen',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep — pier at seven.']]},{id:'nina',kind:'friend',name:'Nina Patel',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',kind:'friend',name:'Lewis',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',kind:'listing',name:'Harbour Coffee',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]},{id:'run',kind:'board',name:'Brighton Sunset Run',context:'Activity Club board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches']]},{id:'film',kind:'board',name:'Outdoor Film Night',context:'Link-up board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];let view='all',current=null,boardError=false,blocked=false;const list=document.getElementById('list'),thread=document.getElementById('thread'),messages=document.getElementById('messages'),input=document.getElementById('input');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}const initial=x=>x.name.split(/\s+/).map(s=>s[0]).join('').slice(0,2);function viewRows(){let a=rows.filter(x=>view==='all'||(view==='friends'&&x.kind==='friend')||(view==='managers'&&x.kind==='listing')||(view==='boards'&&x.kind==='board'));return a.sort((a,b)=>b.unread-a.unread)}function card(x){return `<button class="row ${x.kind==='board'?'boardGate':''}" data-id="${x.id}"><div class="avatar">${esc(initial(x))}</div><div class="main"><div class="name">${esc(x.name)} <span class="type">${x.kind==='listing'?'listing context':x.kind}</span></div><div class="context">${esc(x.context)}</div><div class="preview">${esc(x.preview)}</div></div><div class="right">${esc(x.time)}${x.unread?`<div class="badge">${x.unread}</div>`:''}</div></button>`}function render(){list.innerHTML='';if(view==='boards'){document.getElementById('ruleTitle').textContent='Board source · separate destination system';document.getElementById('ruleMeta').textContent='not DM data';if(boardError){list.innerHTML='<div class="error"><b>Board source unavailable.</b><br>Direct-message views remain unaffected.</div>';return}}else{document.getElementById('ruleTitle').textContent=view==='all'?'One system · grouped by context':'One reusable conversation component';document.getElementById('ruleMeta').textContent='unread first'}const a=viewRows();if(view==='all'){const groups=[['Friends',a.filter(x=>x.kind==='friend')],['Listing context',a.filter(x=>x.kind==='listing')],['Message boards',a.filter(x=>x.kind==='board')]];groups.forEach(([n,g])=>{if(!g.length)return;const d=document.createElement('div');d.className='group';d.innerHTML=`<div class="groupTitle"><span>${n}</span><span>${g.reduce((s,x)=>s+x.unread,0)} unread</span></div>`+g.map(card).join('');list.appendChild(d)})}else list.innerHTML=a.map(card).join('');list.querySelectorAll('.row').forEach(b=>b.onclick=()=>open(rows.find(x=>x.id===b.dataset.id)))}document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.cell').forEach(x=>x.classList.toggle('active',x===b));render()});function open(x){current=x;x.unread=0;document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;blocked=false;syncPermission();renderMsgs();thread.classList.add('open')}function renderMsgs(){messages.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'')+(m[2]==='pending'?' pending':'');d.textContent=m[1];messages.appendChild(d);if(m[2]==='failed'){const s=document.createElement('div');s.className='sendError';s.textContent='not sent · permission re-check failed';messages.appendChild(s)}});messages.scrollTop=messages.scrollHeight}function syncPermission(){document.getElementById('blocked').hidden=!blocked;input.disabled=blocked;document.querySelector('.send').disabled=blocked;const p=document.getElementById('permissionState');p.textContent=blocked?'permission closed':'permission ok';p.classList.toggle('on',blocked)}document.getElementById('back').onclick=()=>{thread.classList.remove('open');render()};document.getElementById('kbd').onclick=()=>{document.querySelector('.composer').style.paddingBottom='max(9px, env(safe-area-inset-bottom), 180px)';setTimeout(()=>document.querySelector('.composer').style.paddingBottom='',1200)};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;const m=['me',t,'pending'];current.msgs.push(m);input.value='';document.getElementById('sending').textContent='sending';document.getElementById('sending').classList.add('on');renderMsgs();setTimeout(()=>{m[2]=null;current.preview=t;current.time='Now';document.getElementById('sending').textContent='idle';document.getElementById('sending').classList.remove('on');renderMsgs()},600)};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;view='boards';document.querySelectorAll('.cell').forEach(x=>x.classList.toggle('active',x.dataset.view==='boards'));render()};document.getElementById('permission').onclick=()=>{if(!current)open(rows[0]);blocked=!blocked;syncPermission()};messages.addEventListener('scroll',()=>{const near=messages.scrollHeight-messages.scrollTop-messages.clientHeight<60;document.getElementById('reading').textContent=near?'at latest':'reading history';document.getElementById('reading').classList.toggle('on',!near)});render();
</script></body></html>
