<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Xplorer Messages — Jordan Singer / Message Switchboard</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;--accent:#175cd3;--soft:#eff4ff;--success:#067647;--danger:#b42318;--shadow:0 20px 60px rgba(16,24,40,.15);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#d9dee5;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--ink)}button,input{font:inherit}
.phone{width:min(100%,430px);height:min(900px,calc(100dvh - 32px));background:var(--bg);border-radius:30px;overflow:hidden;position:relative;box-shadow:var(--shadow);border:1px solid rgba(16,24,40,.08)}
.app{height:100%;display:flex;flex-direction:column}.topbar{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);padding:max(16px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);z-index:3}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.headline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:3px}.title{font-size:26px;font-weight:780;letter-spacing:-.035em}.rulepill{font-size:11px;font-weight:750;color:var(--accent);background:var(--soft);padding:7px 9px;border-radius:999px;border:1px solid #d1e0ff}
.search{margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px}.search input{border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:11px 12px;outline:0;color:var(--ink)}.search input:focus{border-color:#84adff;box-shadow:0 0 0 3px rgba(23,92,211,.12)}.sort{border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:0 11px;font-weight:720;color:#344054;cursor:pointer}.sort[aria-pressed="true"]{background:var(--soft);border-color:#84adff;color:var(--accent)}
.filters{display:flex;gap:7px;overflow:auto;padding-top:10px}.filter{border:1px solid #d0d5dd;background:#fff;color:#475467;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:720;white-space:nowrap;cursor:pointer}.filter[aria-pressed="true"]{background:#101828;color:#fff;border-color:#101828}.count{opacity:.65;margin-left:4px}
.demo{display:flex;gap:7px;overflow:auto;padding-top:9px}.demo button{border:0;background:transparent;padding:4px 2px;color:var(--muted);font-size:10px;font-weight:720;white-space:nowrap;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.list{flex:1;overflow:auto;padding:10px 10px 20px;overscroll-behavior:contain}.summary{padding:2px 6px 8px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.row{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:11px;align-items:center;border:1px solid transparent;background:transparent;border-radius:14px;padding:12px 9px;text-align:left;color:inherit;cursor:pointer}.row:hover{background:#fff;border-color:var(--line)}.row+.row{margin-top:2px}.avatar{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:#e9edf2;font-weight:800;color:#344054;position:relative}.type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}.name{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:3px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread .preview,.unread .name{color:#101828;font-weight:780}.meta{align-self:start;text-align:right;color:var(--muted);font-size:11px;padding-top:2px}.badge{display:inline-grid;place-items:center;background:var(--accent);color:#fff;min-width:20px;height:20px;padding:0 5px;border-radius:999px;font-size:10px;font-weight:800;margin-top:7px}.state{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:4px;background:#fff;border:2px solid var(--bg)}.state.un{background:var(--accent)}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:32px}.empty h2{font-size:18px;margin:0}.empty p{color:var(--muted);max-width:260px;line-height:1.5}.empty code{font-size:11px;background:#eef2f6;border-radius:7px;padding:5px 7px;color:#475467}
.thread{position:absolute;inset:0;background:var(--panel);z-index:10;display:none;flex-direction:column}.thread.open{display:flex}.threadhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 10px 9px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97)}.iconbtn{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:12px;cursor:pointer;color:#344054}.threadwho{text-align:center;min-width:0}.threadwho strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.threadwho span{font-size:10px;color:var(--muted)}.messages{flex:1;overflow:auto;padding:16px 13px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:10px 12px;line-height:1.4;font-size:14px;align-self:flex-start}.bubble.me{background:var(--soft);border-color:#d1e0ff;align-self:flex-end}.bubble.pending{opacity:.58}.bubble.failed{background:#fff6f5;border-color:#fecdca}.status{align-self:flex-end;color:var(--muted);font-size:10px}.status.error{color:var(--danger)}.status button{border:0;background:transparent;color:var(--danger);font-weight:800;cursor:pointer;padding:2px 4px}.composer{display:grid;grid-template-columns:1fr 46px;gap:8px;padding:9px 10px max(9px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}.composer input{border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:12px 13px;outline:0}.composer input:focus{border-color:#84adff;box-shadow:0 0 0 3px rgba(23,92,211,.10)}.send{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}
.fakekbd{height:0;background:#d0d5dd;overflow:hidden;transition:height .18s ease}.fakekbd.open{height:230px}.keys{height:100%;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-content:center;padding:9px}.key{height:35px;background:#fff;border-radius:6px;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,16px);background:#101828;color:#fff;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(23,92,211,.22);outline-offset:2px}
@media (max-width:480px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="phone" aria-label="Xplorer Messages Jordan Singer UX prototype">
<div class="app">
<header class="topbar">
 <div class="eyebrow">Xplorer · UX prototype 2</div>
 <div class="headline"><div class="title">Messages</div><div class="rulepill" id="rulepill">Rule: recent</div></div>
 <div class="search"><input id="search" type="search" placeholder="Find a conversation" aria-label="Find a conversation"><button class="sort" id="unreadSort" aria-pressed="false">Unread first</button></div>
 <div class="filters" id="filters" aria-label="Conversation filters">
  <button class="filter" data-filter="all" aria-pressed="true">All <span class="count" data-count="all"></span></button>
  <button class="filter" data-filter="friends" aria-pressed="false">Friends <span class="count" data-count="friends"></span></button>
  <button class="filter" data-filter="managers" aria-pressed="false">Managers <span class="count" data-count="managers"></span></button>
  <button class="filter" data-filter="boards" aria-pressed="false">Boards <span class="count" data-count="boards"></span></button>
 </div>
 <div class="demo"><button id="emptyToggle">Demo empty result</button><button id="keyboardToggle">Demo keyboard</button><button id="reset">Reset rules</button></div>
</header>
<section class="list" id="list" aria-live="polite"></section>
</div>
<section class="thread" id="thread" aria-label="Conversation">
 <header class="threadhead"><button class="iconbtn" id="back" aria-label="Back to messages">←</button><div class="threadwho"><strong id="threadName"></strong><span id="threadType"></span></div><button class="iconbtn" id="keyboardInThread" aria-label="Toggle keyboard demo">⌨</button></header>
 <div class="messages" id="messages"></div>
 <form class="composer" id="composer"><input id="messageInput" placeholder="Message…" autocomplete="off" aria-label="Message"><button class="send" aria-label="Send message">↑</button></form>
 <div class="fakekbd" id="fakekbd" aria-hidden="true"><div class="keys" id="keys"></div></div>
</section>
<div class="toast" id="toast" role="status"></div>
</main>
<script>
const threads=[
{id:'maya',category:'friends',type:'Friend',name:'Maya Chen',initials:'MC',preview:'Still good for the seafront at seven?',time:'19:42',rank:6,unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yeah — I’ll meet you by the pier.']]},
{id:'run',category:'boards',type:'Message Board',name:'Brighton Sunset Run',initials:'BR',preview:'Asha: meeting point moved to the arches',time:'19:51',rank:7,unread:5,msgs:[['them','Asha: meeting point moved to the arches'],['them','Tom: I’ll bring spare water.']]},
{id:'harbour',category:'managers',type:'Manager',name:'Harbour Coffee',initials:'HC',preview:'Your table is held until 10:15',time:'Mon',rank:3,unread:0,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]},
{id:'lewis',category:'friends',type:'Friend',name:'Lewis',initials:'L',preview:'That place was actually brilliant 😂',time:'18:05',rank:5,unread:0,msgs:[['them','That place was actually brilliant 😂'],['me','Told you it was worth it.']]},
{id:'film',category:'boards',type:'Message Board',name:'Outdoor Film Night',initials:'OF',preview:'Sam: gates open at 8',time:'Fri',rank:2,unread:0,msgs:[['them','Sam: gates open at 8']]},
{id:'nina',category:'friends',type:'Friend',name:'Nina Patel',initials:'NP',preview:'I sent the location in the group',time:'Tue',rank:4,unread:1,msgs:[['them','I sent the location in the group']]}
];
let filter='all',unreadFirst=false,emptyDemo=false,current=null,lastScroll=0;
const list=document.getElementById('list'),search=document.getElementById('search'),thread=document.getElementById('thread'),messages=document.getElementById('messages'),input=document.getElementById('messageInput'),fakekbd=document.getElementById('fakekbd'),toast=document.getElementById('toast');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function filtered(){const q=search.value.trim().toLowerCase();let rows=threads.filter(t=>(filter==='all'||t.category===filter)&&(!q||(t.name+' '+t.preview+' '+t.type).toLowerCase().includes(q)));if(unreadFirst)rows=rows.slice().sort((a,b)=>(b.unread>0)-(a.unread>0)||b.rank-a.rank);else rows=rows.slice().sort((a,b)=>b.rank-a.rank);return emptyDemo?[]:rows}
function updateCounts(){const cats=['friends','managers','boards'];document.querySelector('[data-count="all"]').textContent=threads.length;cats.forEach(c=>document.querySelector(`[data-count="${c}"]`).textContent=threads.filter(t=>t.category===c).length)}
function render(){const rows=filtered();document.getElementById('rulepill').textContent=unreadFirst?'Rule: unread → recent':'Rule: recent';list.innerHTML=`<div class="summary"><span>${rows.length} conversation${rows.length===1?'':'s'}</span><span>${filter==='all'?'All types':filter}</span></div>`;if(!rows.length){list.innerHTML+=`<div class="empty"><div><h2>No matches</h2><p>The current rules are explicit: <code>${esc(filter)}</code>${unreadFirst?' + unread first':''}${search.value?` + “${esc(search.value)}”`:''}.</p><p>Change a filter or clear search to return to the full inbox.</p></div></div>`;return}rows.forEach(t=>{const row=document.createElement('button');row.className='row'+(t.unread?' unread':'');row.innerHTML=`<div class="avatar">${esc(t.initials)}<i class="state ${t.unread?'un':''}" aria-hidden="true"></i></div><div><div class="type">${esc(t.type)}</div><div class="name">${esc(t.name)}</div><div class="preview">${esc(t.preview)}</div></div><div class="meta">${esc(t.time)}${t.unread?`<div class="badge" aria-label="${t.unread} unread">${t.unread}</div>`:''}</div>`;row.addEventListener('click',()=>openThread(t));list.appendChild(row)});requestAnimationFrame(()=>list.scrollTop=lastScroll)}
function setFilter(next){lastScroll=list.scrollTop;filter=next;document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));render()}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
function openThread(t){lastScroll=list.scrollTop;current=t;t.unread=0;document.getElementById('threadName').textContent=t.name;document.getElementById('threadType').textContent=t.type;renderMessages();thread.classList.add('open');setTimeout(()=>messages.scrollTop=messages.scrollHeight,0)}
function closeThread(){thread.classList.remove('open');fakekbd.classList.remove('open');render()}
function renderMessages(){messages.innerHTML='';current.msgs.forEach((m,i)=>{const b=document.createElement('div');b.className='bubble '+(m[0]==='me'?'me ':'')+(m[2]||'');b.textContent=m[1];messages.appendChild(b);if(m[2]==='pending'){const s=document.createElement('div');s.className='status';s.textContent='Sending…';messages.appendChild(s)}if(m[2]==='failed'){const s=document.createElement('div');s.className='status error';s.innerHTML='Not sent · <button type="button">Retry</button>';s.querySelector('button').onclick=()=>retry(i);messages.appendChild(s)}});messages.scrollTop=messages.scrollHeight}
function retry(i){current.msgs[i][2]='pending';renderMessages();setTimeout(()=>{current.msgs[i][2]=null;current.preview=current.msgs[i][1];current.time='Now';current.rank=99;renderMessages();showToast('Sent')},600)}
function submit(e){e.preventDefault();const text=input.value.trim();if(!text)return;const i=current.msgs.push(['me',text,'pending'])-1;input.value='';renderMessages();setTimeout(()=>{const fail=/fail/i.test(text);current.msgs[i][2]=fail?'failed':null;if(!fail){current.preview=text;current.time='Now';current.rank=99}renderMessages();if(!fail)showToast('Sent')},650)}
function toggleKeyboard(){fakekbd.classList.toggle('open');setTimeout(()=>messages.scrollTop=messages.scrollHeight,20)}
function showToast(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}
for(let i=0;i<30;i++){const k=document.createElement('div');k.className='key';document.getElementById('keys').appendChild(k)}
search.addEventListener('input',render);document.getElementById('unreadSort').addEventListener('click',e=>{unreadFirst=!unreadFirst;e.currentTarget.setAttribute('aria-pressed',String(unreadFirst));render()});document.getElementById('emptyToggle').addEventListener('click',e=>{emptyDemo=!emptyDemo;e.currentTarget.textContent=emptyDemo?'Show rule results':'Demo empty result';render()});document.getElementById('reset').addEventListener('click',()=>{filter='all';unreadFirst=false;emptyDemo=false;search.value='';document.getElementById('unreadSort').setAttribute('aria-pressed','false');document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter==='all')));document.getElementById('emptyToggle').textContent='Demo empty result';render();showToast('Rules reset')});document.getElementById('back').addEventListener('click',closeThread);document.getElementById('composer').addEventListener('submit',submit);document.getElementById('keyboardInThread').addEventListener('click',toggleKeyboard);document.getElementById('keyboardToggle').addEventListener('click',()=>{if(!thread.classList.contains('open'))openThread(filtered()[0]||threads[0]);toggleKeyboard()});input.addEventListener('focus',()=>setTimeout(()=>messages.scrollTop=messages.scrollHeight,80));updateCounts();render();
</script>
</body>
</html>
