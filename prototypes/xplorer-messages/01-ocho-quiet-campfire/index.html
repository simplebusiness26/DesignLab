<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Round 2 — Pocket Campfire</title><style>
:root{--paper:#f7f0df;--card:#fffaf0;--ink:#25221d;--muted:#766f63;--green:#3f6c56;--green2:#dce9de;--red:#a74d3d;--line:#d9cdb7;--yellow:#f4d77d;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d9d2c3;color:var(--ink)}button,input{font:inherit}.phone{width:min(100%,430px);height:min(920px,100dvh);margin:auto;background:var(--paper);overflow:hidden;position:relative;box-shadow:0 18px 60px #0002}.app{height:100%;display:flex;flex-direction:column}.head{padding:max(18px,env(safe-area-inset-top)) 16px 10px}.stamp{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transform:rotate(-1deg)}.stamp:before{content:"";width:10px;height:10px;border-radius:50% 45% 55% 50%;background:var(--green)}h1{font-size:34px;letter-spacing:-.055em;line-height:1;margin:7px 0 4px}.sub{font-size:13px;color:var(--muted)}.shelf{display:flex;gap:7px;overflow:auto;padding:9px 16px 13px;scrollbar-width:none}.shelf::-webkit-scrollbar{display:none}.shelf button{border:2px solid var(--ink);background:var(--card);padding:9px 12px;border-radius:15px 11px 16px 12px;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:2px 3px 0 #2d2a24;transform:rotate(var(--r,0deg));cursor:pointer}.shelf button:nth-child(1){--r:-1deg}.shelf button:nth-child(2){--r:.7deg}.shelf button:nth-child(3){--r:-.6deg}.shelf button:nth-child(4){--r:1deg}.shelf button.active{background:var(--yellow);transform:translateY(2px) rotate(var(--r));box-shadow:1px 1px 0 #2d2a24}.summary{margin:0 16px 8px;padding:10px 12px;background:var(--green2);border:1.5px solid #9db7a4;border-radius:19px 15px 18px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.summary strong{font-size:13px}.summary span{font-size:11px;color:#50695a}.list{flex:1;overflow:auto;padding:6px 14px 110px}.note{width:100%;border:0;background:transparent;text-align:left;padding:0;margin:0 0 11px;cursor:pointer}.paper{position:relative;background:var(--card);border:1.7px solid var(--line);border-radius:24px 18px 22px 16px;padding:14px 14px 13px 66px;min-height:76px;box-shadow:0 5px 0 #c9bea9;transform:rotate(var(--tilt,0deg));transition:.18s transform}.note:nth-child(2n) .paper{--tilt:.5deg}.note:nth-child(3n) .paper{--tilt:-.6deg}.note:active .paper{transform:translateY(3px) rotate(var(--tilt));box-shadow:0 2px 0 #c9bea9}.avatar{position:absolute;left:13px;top:13px;width:43px;height:43px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:48% 52% 46% 54%;font-weight:900;background:#eedfae}.board .avatar{background:#d7e5dc;border-radius:14px 19px 13px 18px}.name{font-weight:900;font-size:15px;line-height:1.1;padding-right:42px}.context{font-size:11px;color:var(--green);font-weight:800;margin-top:3px}.preview{font-size:13px;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{position:absolute;right:13px;top:13px;font-size:10px;color:var(--muted)}.pebble{position:absolute;right:13px;bottom:13px;min-width:22px;height:22px;padding:0 6px;border:2px solid var(--ink);border-radius:50% 46% 52% 48%;display:grid;place-items:center;background:var(--yellow);font-size:10px;font-weight:950}.door{position:absolute;right:12px;bottom:13px;font-size:18px}.scopedError{border:1.6px dashed var(--red);color:var(--red);border-radius:17px;padding:11px;margin:8px 3px 12px;font-size:12px;background:#fff7f4}.thread{position:absolute;inset:0;background:var(--paper);z-index:10;display:flex;flex-direction:column;transform:translateY(105%);transition:.32s cubic-bezier(.2,.85,.25,1)}.thread.open{transform:none}.th{padding:max(15px,env(safe-area-inset-top)) 12px 10px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}.back,.tiny{border:2px solid var(--ink);background:var(--card);width:42px;height:42px;border-radius:15px 12px 16px 13px;box-shadow:2px 2px 0 #2d2a24;font-weight:900}.who{text-align:center}.who b{display:block;font-size:15px}.who span{display:block;font-size:10px;color:var(--green);font-weight:800;margin-top:2px}.trail{flex:1;overflow:auto;padding:12px 15px 18px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:11px 13px;background:var(--card);border:1.5px solid var(--line);border-radius:19px 18px 20px 13px;box-shadow:0 2px 0 #d4c9b4;align-self:flex-start;font-size:14px;line-height:1.35}.bubble.me{align-self:flex-end;background:var(--green2);border-color:#a8bcae;border-radius:18px 20px 13px 19px}.bubble.pop{animation:pop .32s ease-out}.status{font-size:10px;color:var(--muted);align-self:flex-end;margin-top:-7px}.blocked{margin:0 13px 8px;padding:10px 11px;border:1.5px dashed var(--red);border-radius:15px;background:#fff7f4;color:#7d3b31;font-size:11px}.composer{display:grid;grid-template-columns:1fr 52px;gap:8px;padding:8px 11px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}.composer input{border:2px solid var(--ink);background:var(--card);border-radius:17px 14px 18px 13px;padding:12px 13px;outline:0}.send{border:2px solid var(--ink);background:var(--yellow);border-radius:18px 15px 19px 14px;box-shadow:2px 3px 0 #2d2a24;font-weight:950}.keyboard{height:0;overflow:hidden;background:#cbc8c1;transition:.22s}.keyboard.show{height:220px}.keys{padding:9px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.key{height:34px;background:#fff;border-radius:6px}.demo{position:absolute;left:50%;bottom:10px;translate:-50% 0;z-index:4;display:flex;gap:6px}.demo button{border:1px solid #b5aa97;background:#fffaf0dd;border-radius:999px;padding:7px 9px;font-size:10px;color:var(--muted);font-weight:800}@keyframes pop{0%{transform:scale(.85) rotate(1deg);opacity:.2}70%{transform:scale(1.035) rotate(-.4deg)}100%{transform:none;opacity:1}}@media(max-width:480px){body{background:var(--paper)}.phone{width:100%;height:100dvh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="phone"><div class="app"><header class="head"><div class="stamp">Round 2 · Pocket Campfire</div><h1>Messages</h1><div class="sub">A small place for people, places and plans.</div></header><nav class="shelf" aria-label="Message views"><button data-view="all" class="active">All <span>8</span></button><button data-view="friends">Friends <span>3</span></button><button data-view="managers">Managers <span>1</span></button><button data-view="boards">Boards <span>4</span></button></nav><div class="summary"><strong id="summaryTitle">8 unread little knocks</strong><span id="summaryCopy">Nothing shouting for attention.</span></div><section class="list" id="list"></section></div><section class="thread" id="thread"><header class="th"><button class="back" id="back" aria-label="Back">←</button><div class="who"><b id="who">Conversation</b><span id="why">Friend</span></div><button class="tiny" id="kbd" aria-label="Keyboard demo">⌨</button></header><div class="trail" id="trail"></div><div class="blocked" id="blocked" hidden>This relationship has ended. You can still read the history, but sending is no longer available.</div><form class="composer" id="composer"><input id="input" placeholder="Write something…" autocomplete="off"><button class="send">send</button></form><div class="keyboard" id="keyboard"><div class="keys" id="keys"></div></div></section><div class="demo"><button id="boardFail">Board error</button><button id="permission">Permission ended</button></div></main><script>
const items=[{id:'maya',view:'friends',name:'Maya Chen',initials:'MC',context:'Friend',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yep. I’ll meet you by the pier.']]},{id:'nina',view:'friends',name:'Nina Patel',initials:'NP',context:'Friend',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]},{id:'lewis',view:'friends',name:'Lewis',initials:'L',context:'Friend',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂']]},{id:'harbour',view:'managers',name:'Harbour Coffee',initials:'HC',context:'About Harbour Coffee',preview:'Your table is held until 10:15',time:'Mon',unread:1,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]},{id:'run',view:'boards',name:'Brighton Sunset Run',initials:'BR',context:'Activity Club message board',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:3,msgs:[['them','Asha: meeting point moved to the arches'],['them','Tom: I’ll bring spare water.']]},{id:'film',view:'boards',name:'Outdoor Film Night',initials:'OF',context:'Link-up message board',preview:'Sam: gates open at 8',time:'Fri',unread:1,msgs:[['them','Sam: gates open at 8']]}];
let view='all',current=null,boardError=false,blocked=false;const list=document.getElementById('list'),thread=document.getElementById('thread'),trail=document.getElementById('trail'),input=document.getElementById('input'),keyboard=document.getElementById('keyboard');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function visible(){return view==='all'?items:items.filter(x=>x.view===view)}function render(){list.innerHTML='';if(view==='boards'&&boardError){list.innerHTML='<div class="scopedError"><b>Boards couldn’t load.</b><br>Your direct conversations are still safe in the other views. Tap “Board error” to retry the demo.</div>';return}visible().forEach(x=>{const b=document.createElement('button');b.className='note '+(x.view==='boards'?'board':'');b.innerHTML=`<div class="paper"><div class="avatar">${esc(x.initials)}</div><div class="name">${esc(x.name)}</div><div class="context">${esc(x.context)}</div><div class="preview">${esc(x.preview)}</div><div class="time">${esc(x.time)}</div>${x.view==='boards'?'<div class="door">↗</div>':x.unread?`<div class="pebble">${x.unread}</div>`:''}</div>`;b.onclick=()=>openThread(x);list.appendChild(b)});const unread=visible().reduce((n,x)=>n+x.unread,0);document.getElementById('summaryTitle').textContent=unread?`${unread} unread ${unread===1?'knock':'little knocks'}`:'All caught up';document.getElementById('summaryCopy').textContent=view==='boards'?'Boards are doorways, not another DM type.':'Nothing shouting for attention.'}document.querySelectorAll('.shelf button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.shelf button').forEach(x=>x.classList.toggle('active',x===b));render()});function openThread(x){current=x;x.unread=0;document.getElementById('who').textContent=x.name;document.getElementById('why').textContent=x.context;blocked=false;syncBlocked();renderTrail();thread.classList.add('open');setTimeout(()=>trail.scrollTop=trail.scrollHeight,20)}function renderTrail(){trail.innerHTML='';current.msgs.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m[0]==='me'?'me':'');d.textContent=m[1];trail.appendChild(d)});trail.scrollTop=trail.scrollHeight}function syncBlocked(){document.getElementById('blocked').hidden=!blocked;input.disabled=blocked;document.querySelector('.send').disabled=blocked}document.getElementById('back').onclick=()=>{thread.classList.remove('open');keyboard.classList.remove('show');render()};document.getElementById('kbd').onclick=()=>{keyboard.classList.toggle('show');setTimeout(()=>trail.scrollTop=trail.scrollHeight,30)};document.getElementById('composer').onsubmit=e=>{e.preventDefault();if(!current||blocked)return;const t=input.value.trim();if(!t)return;current.msgs.push(['me',t]);current.preview=t;current.time='Now';input.value='';renderTrail();trail.lastElementChild.classList.add('pop')};document.getElementById('boardFail').onclick=()=>{boardError=!boardError;view='boards';document.querySelectorAll('.shelf button').forEach(x=>x.classList.toggle('active',x.dataset.view==='boards'));render()};document.getElementById('permission').onclick=()=>{if(!current)openThread(items[0]);blocked=!blocked;syncBlocked()};for(let i=0;i<30;i++){const k=document.createElement('div');k.className='key';document.getElementById('keys').appendChild(k)}render();
</script></body></html>
