<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Xplorer Messages — Ocho / Quiet Campfire</title>
<style>
:root{color-scheme:light;--bg:#f5f3ef;--panel:#fffdfa;--ink:#1b1b19;--muted:#77736d;--line:#e8e2da;--accent:#2d624b;--accentSoft:#e5efe9;--danger:#a23a31;--shadow:0 18px 50px rgba(33,27,21,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#dedbd5;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
button,input{font:inherit}.phone{width:min(100%,430px);height:min(900px,calc(100dvh - 32px));background:var(--bg);border-radius:32px;overflow:hidden;box-shadow:var(--shadow);position:relative;border:1px solid rgba(0,0,0,.06)}
.app{height:100%;display:flex;flex-direction:column}.topbar{padding:max(18px,env(safe-area-inset-top)) 18px 12px;background:rgba(245,243,239,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:28px;font-weight:760;letter-spacing:-.035em}.eyebrow{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.08em;text-transform:uppercase}.iconbtn{border:0;background:transparent;border-radius:14px;min-width:44px;min-height:44px;padding:10px;color:var(--ink);cursor:pointer}.iconbtn:focus-visible,.seg button:focus-visible,.row:focus-visible,.send:focus-visible,.demo button:focus-visible{outline:3px solid rgba(45,98,75,.28);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px;padding:4px;background:#ebe7e0;border-radius:15px}.seg button{border:0;border-radius:11px;padding:10px 7px;background:transparent;color:#65615b;font-size:13px;font-weight:700;cursor:pointer}.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.demo{display:flex;gap:8px;overflow:auto;margin-top:11px;padding-bottom:2px}.demo button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer}
.list{flex:1;overflow:auto;padding:6px 10px 18px;overscroll-behavior:contain}.row{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:inherit}.avatar{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-weight:800;background:#e8e2d9;color:#4e4942;position:relative}.avatar.board{border-radius:16px;background:#e2e9e5;color:#355646}.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);right:-2px;top:-2px;border:3px solid var(--bg)}.rowmain{min-width:0}.rowtop{display:flex;align-items:center;gap:7px}.name{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kind{font-size:10px;color:var(--muted);background:#ece8e1;border-radius:999px;padding:3px 6px;font-weight:700}.preview{margin-top:4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.unread .preview{color:#3e3b36;font-weight:650}.meta{text-align:right;color:var(--muted);font-size:12px;align-self:start;padding-top:2px}.badge{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--accent);color:white;font-size:11px;font-weight:800;margin-top:8px}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:40px}.empty .shape{width:72px;height:72px;border-radius:28px;background:#e7e2db;display:grid;place-items:center;margin:auto auto 16px;font-size:28px}.empty h2{margin:0;font-size:20px}.empty p{color:var(--muted);line-height:1.5;margin:8px auto;max-width:250px}
.thread{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;z-index:10}.thread.open{display:flex}.threadhead{padding:max(12px,env(safe-area-inset-top)) 12px 10px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,253,250,.97);backdrop-filter:blur(12px)}.threadwho{text-align:center}.threadwho strong{display:block;font-size:15px}.threadwho span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.messages{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}.bubble{max-width:82%;padding:11px 13px;border-radius:18px;line-height:1.35;font-size:15px;background:#eeeae4;align-self:flex-start}.bubble.me{background:var(--accentSoft);align-self:flex-end}.bubble.pending{opacity:.64}.bubble.failed{border:1px solid rgba(162,58,49,.35);background:#fff4f2}.status{font-size:11px;color:var(--muted);margin-top:-4px;align-self:flex-end}.status.error{color:var(--danger);display:flex;gap:7px;align-items:center}.status button{border:0;background:transparent;color:var(--danger);font-weight:800;padding:3px;cursor:pointer}
.composer{padding:9px 10px max(9px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 48px;gap:8px;background:var(--panel);position:relative;z-index:12}.composer input{width:100%;border:1px solid #ddd6cd;border-radius:16px;padding:13px 14px;background:#f8f5f1;color:var(--ink);outline:0}.composer input:focus{border-color:#9cb2a7;box-shadow:0 0 0 3px rgba(45,98,75,.10)}.send{border:0;border-radius:16px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.send:disabled{opacity:.38;cursor:not-allowed}
.fakekbd{height:0;background:#d7d5d1;overflow:hidden;transition:height .22s ease;flex:0 0 auto}.fakekbd.open{height:235px}.keys{height:100%;padding:9px;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-content:center}.key{height:36px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.toast{position:absolute;left:50%;bottom:18px;translate:-50% 20px;background:#1f211f;color:white;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}.toast.show{opacity:1;translate:-50% 0}
@media (max-width:480px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="phone" aria-label="Xplorer Messages Ocho UX prototype">
<div class="app" id="app">
  <header class="topbar">
    <div class="eyebrow">Xplorer · UX prototype 1</div>
    <div class="topline"><div class="title">Messages</div><button class="iconbtn" id="markRead" aria-label="Mark visible messages read">✓</button></div>
    <div class="seg" role="tablist" aria-label="Message categories">
      <button role="tab" data-cat="friends" aria-selected="true">Friends</button>
      <button role="tab" data-cat="managers" aria-selected="false">Managers</button>
      <button role="tab" data-cat="boards" aria-selected="false">Boards</button>
    </div>
    <div class="demo" aria-label="Prototype demo controls"><button id="emptyToggle">Demo empty state</button><button id="keyboardToggle">Demo keyboard</button><button id="motionToggle">Reduced motion</button></div>
  </header>
  <section class="list" id="list" aria-live="polite"></section>
</div>
<section class="thread" id="thread" aria-label="Conversation thread">
  <header class="threadhead"><button class="iconbtn" id="back" aria-label="Back to messages">←</button><div class="threadwho"><strong id="threadName">Conversation</strong><span id="threadKind">Friend</span></div><button class="iconbtn" id="keyboardInThread" aria-label="Toggle keyboard demo">⌨</button></header>
  <div class="messages" id="messages"></div>
  <form class="composer" id="composer"><input id="messageInput" autocomplete="off" placeholder="Message…" aria-label="Message"/><button class="send" id="send" aria-label="Send message">↑</button></form>
  <div class="fakekbd" id="fakekbd" aria-hidden="true"><div class="keys" id="keys"></div></div>
</section>
<div class="toast" id="toast" role="status"></div>
</main>
<script>
const data={friends:[{id:'maya',name:'Maya Chen',kind:'Friend',initials:'MC',preview:'Still good for the seafront at seven?',time:'19:42',unread:2,msgs:[['them','Still good for the seafront at seven?'],['me','Yeah — I’ll meet you by the pier.']]},{id:'lewis',name:'Lewis',kind:'Friend',initials:'L',preview:'That place was actually brilliant 😂',time:'18:05',unread:0,msgs:[['them','That place was actually brilliant 😂'],['me','Told you it was worth it.']]},{id:'nina',name:'Nina Patel',kind:'Friend',initials:'NP',preview:'I sent the location in the group',time:'Tue',unread:1,msgs:[['them','I sent the location in the group']]}],managers:[{id:'harbour',name:'Harbour Coffee',kind:'Manager',initials:'HC',preview:'Your table is held until 10:15',time:'Mon',unread:0,msgs:[['them','Your table is held until 10:15'],['me','Perfect, thank you.']]}],boards:[{id:'runclub',name:'Brighton Sunset Run',kind:'Message Board',initials:'BR',preview:'Asha: meeting point moved to the arches',time:'19:51',unread:5,msgs:[['them','Asha: meeting point moved to the arches'],['them','Tom: I’ll bring spare water.']]},{id:'film',name:'Outdoor Film Night',kind:'Message Board',initials:'OF',preview:'Sam: gates open at 8',time:'Fri',unread:0,msgs:[['them','Sam: gates open at 8']]}]};
let category='friends',emptyDemo=false,current=null,reduced=false,lastScroll={friends:0,managers:0,boards:0};
const list=document.getElementById('list'),thread=document.getElementById('thread'),messages=document.getElementById('messages'),input=document.getElementById('messageInput'),send=document.getElementById('send'),fakekbd=document.getElementById('fakekbd'),toast=document.getElementById('toast');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderList(){list.innerHTML='';if(emptyDemo){list.innerHTML=`<div class="empty"><div><div class="shape">☕</div><h2>Quiet here for now</h2><p>No ${category==='boards'?'message boards':category} to show. When one appears, it will live right here.</p></div></div>`;return}data[category].forEach(item=>{const row=document.createElement('button');row.className='row'+(item.unread?' unread':'');row.dataset.id=item.id;row.innerHTML=`<div class="avatar ${category==='boards'?'board':''}">${esc(item.initials)}${item.unread?'<i class="dot" aria-hidden="true"></i>':''}</div><div class="rowmain"><div class="rowtop"><span class="name">${esc(item.name)}</span>${category!=='friends'?`<span class="kind">${esc(item.kind)}</span>`:''}</div><div class="preview">${esc(item.preview)}</div></div><div class="meta">${esc(item.time)}${item.unread?`<div class="badge" aria-label="${item.unread} unread">${item.unread}</div>`:''}</div>`;row.addEventListener('click',()=>openThread(item));list.appendChild(row)});list.scrollTop=lastScroll[category]||0}
function setCategory(next){lastScroll[category]=list.scrollTop;category=next;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.cat===category)));renderList()}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setCategory(b.dataset.cat)));
function openThread(item){lastScroll[category]=list.scrollTop;current=item;item.unread=0;document.getElementById('threadName').textContent=item.name;document.getElementById('threadKind').textContent=item.kind;renderMessages();thread.classList.add('open');thread.style.display='flex';setTimeout(()=>messages.scrollTop=messages.scrollHeight,0)}
function closeThread(){thread.classList.remove('open');thread.style.display='none';fakekbd.classList.remove('open');renderList();requestAnimationFrame(()=>list.scrollTop=lastScroll[category]||0)}
function renderMessages(){messages.innerHTML='';current.msgs.forEach((m,i)=>{const div=document.createElement('div');div.className='bubble '+(m[0]==='me'?'me':'')+(m[2]==='pending'?' pending':'')+(m[2]==='failed'?' failed':'');div.textContent=m[1];messages.appendChild(div);if(m[2]==='pending'){const s=document.createElement('div');s.className='status';s.textContent='Sending…';messages.appendChild(s)}if(m[2]==='failed'){const s=document.createElement('div');s.className='status error';s.innerHTML='Not sent · <button type="button">Retry</button>';s.querySelector('button').addEventListener('click',()=>retry(i));messages.appendChild(s)}});messages.scrollTop=messages.scrollHeight}
function retry(i){current.msgs[i][2]='pending';renderMessages();setTimeout(()=>{current.msgs[i][2]=null;current.preview=current.msgs[i][1];current.time='Now';renderMessages();showToast('Sent')},650)}
function submitMessage(e){e.preventDefault();const text=input.value.trim();if(!text)return;const idx=current.msgs.push(['me',text,'pending'])-1;input.value='';renderMessages();setTimeout(()=>{const fail=/fail/i.test(text);current.msgs[idx][2]=fail?'failed':null;if(!fail){current.preview=text;current.time='Now'}renderMessages();if(!fail)showToast('Sent')},700)}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
function toggleKeyboard(){fakekbd.classList.toggle('open');setTimeout(()=>messages.scrollTop=messages.scrollHeight,30)}
for(let i=0;i<30;i++){const k=document.createElement('div');k.className='key';document.getElementById('keys').appendChild(k)}
document.getElementById('back').addEventListener('click',closeThread);document.getElementById('composer').addEventListener('submit',submitMessage);document.getElementById('keyboardInThread').addEventListener('click',toggleKeyboard);document.getElementById('keyboardToggle').addEventListener('click',()=>{if(!thread.classList.contains('open'))openThread(data[category][0]);toggleKeyboard()});document.getElementById('emptyToggle').addEventListener('click',e=>{emptyDemo=!emptyDemo;e.currentTarget.textContent=emptyDemo?'Show messages':'Demo empty state';renderList()});document.getElementById('motionToggle').addEventListener('click',e=>{reduced=!reduced;document.documentElement.style.scrollBehavior=reduced?'auto':'';document.documentElement.classList.toggle('reduced',reduced);e.currentTarget.textContent=reduced?'Motion reduced ✓':'Reduced motion';showToast(reduced?'Reduced motion on':'Reduced motion off')});document.getElementById('markRead').addEventListener('click',()=>{data[category].forEach(x=>x.unread=0);renderList();showToast('Visible messages marked read')});input.addEventListener('focus',()=>setTimeout(()=>messages.scrollTop=messages.scrollHeight,100));renderList();
</script>
</body>
</html>
