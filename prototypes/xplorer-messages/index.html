<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>DesignLab 2.0 — Xplorer Messages UX Review</title>
<style>
:root{color-scheme:light;--bg:#eef0f3;--panel:#fff;--ink:#17181a;--muted:#6f737b;--line:#dfe2e6;--accent:#17181a;--soft:#f4f5f7;--ok:#157347;--shadow:0 12px 36px rgba(18,20,24,.10);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,textarea{font:inherit}.shell{min-height:100dvh;display:flex;flex-direction:column}.reviewbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 12px 10px}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto}.heading{min-width:0}.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted)}h1{font-size:18px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 0}.progress{flex:0 0 auto;font-size:11px;font-weight:750;color:var(--muted);background:var(--soft);border-radius:999px;padding:7px 9px}.tabswrap{max-width:980px;margin:10px auto 0;display:flex;align-items:center;gap:8px}.tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none;flex:1;padding:1px}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#fff;color:#555a62;border-radius:12px;padding:9px 11px;white-space:nowrap;cursor:pointer;font-size:12px;font-weight:760}.tab[aria-selected="true"]{background:#17181a;color:#fff;border-color:#17181a}.open{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 10px;font-size:12px;font-weight:760;text-decoration:none;white-space:nowrap}.concept{max-width:980px;margin:8px auto 0;color:var(--muted);font-size:11px;line-height:1.45;min-height:16px}.stage{flex:1;min-height:0;position:relative}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.frame.active{display:block}.reviewdock{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:60;display:flex;gap:8px}.round{border:0;background:#17181a;color:#fff;border-radius:999px;padding:11px 14px;font-size:12px;font-weight:800;box-shadow:var(--shadow);cursor:pointer}.round.secondary{background:#fff;color:#17181a;border:1px solid var(--line)}.drawerback{position:fixed;inset:0;background:rgba(10,12,16,.28);z-index:70;opacity:0;pointer-events:none;transition:.18s}.drawerback.open{opacity:1;pointer-events:auto}.drawer{position:absolute;left:0;right:0;bottom:0;max-height:min(72dvh,620px);overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:14px 14px max(18px,env(safe-area-inset-bottom));transform:translateY(100%);transition:.22s cubic-bezier(.2,.8,.2,1)}.drawerback.open .drawer{transform:translateY(0)}.handle{width:42px;height:5px;border-radius:99px;background:#d2d5da;margin:0 auto 12px}.drawerhead{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:720px;margin:0 auto}.drawerhead h2{font-size:17px;margin:0}.close{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;cursor:pointer}.notes{max-width:720px;margin:12px auto 0}.noteMeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin-bottom:7px}.notes textarea{width:100%;min-height:150px;border:1px solid var(--line);background:#fafafa;border-radius:14px;padding:12px;resize:vertical;outline:0;color:var(--ink);line-height:1.45}.notes textarea:focus{border-color:#8f949d;box-shadow:0 0 0 3px rgba(23,24,26,.07)}.draweractions{max-width:720px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.draweractions button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:760;cursor:pointer}.draweractions .primary{background:#17181a;color:#fff;border-color:#17181a}.saved{color:var(--ok);font-weight:750}.toast{position:fixed;left:50%;bottom:76px;translate:-50% 12px;background:#17181a;color:#fff;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:760;opacity:0;pointer-events:none;transition:.18s;z-index:90}.toast.show{opacity:1;translate:-50% 0}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid rgba(23,24,26,.22);outline-offset:2px}@media(max-width:600px){.reviewbar{padding-left:9px;padding-right:9px}.tabswrap{gap:6px}.tab{padding:8px 9px}.open{padding:8px 9px}.stage{min-height:calc(100dvh - 142px)}.reviewdock{right:9px;bottom:max(9px,env(safe-area-inset-bottom))}.round{padding:10px 12px}.draweractions{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="reviewbar">
  <div class="topline">
    <div class="heading"><div class="eyebrow">DesignLab 2.0 · UX tournament review</div><h1>Xplorer Messages</h1></div>
    <div class="progress" id="progress">1 of 4</div>
  </div>
  <div class="tabswrap">
    <nav class="tabs" role="tablist" aria-label="UX prototypes">
      <button class="tab" role="tab" data-key="ocho" aria-selected="true">1 · Ocho</button>
      <button class="tab" role="tab" data-key="jordan" aria-selected="false">2 · Jordan</button>
      <button class="tab" role="tab" data-key="loren" aria-selected="false">3 · Loren</button>
      <button class="tab" role="tab" data-key="christian" aria-selected="false">4 · Christian</button>
    </nav>
    <a class="open" id="openFull" href="./01-ocho-quiet-campfire/index.html" target="_blank" rel="noopener">Full screen ↗</a>
  </div>
  <div class="concept" id="concept">Quiet Campfire — calm, human, low-cognitive-load messaging.</div>
</header>
<main class="stage" id="stage">
  <iframe class="frame active" data-key="ocho" src="./01-ocho-quiet-campfire/index.html" title="Ocho Quiet Campfire UX prototype"></iframe>
  <iframe class="frame" data-key="jordan" src="./02-jordan-message-switchboard/index.html" title="Jordan Singer Message Switchboard UX prototype"></iframe>
  <iframe class="frame" data-key="loren" src="./03-loren-flow-through/index.html" title="Loren Brichter Flow Through UX prototype"></iframe>
  <iframe class="frame" data-key="christian" src="./04-christian-native-power/index.html" title="Christian Selig Native Power Inbox UX prototype"></iframe>
</main>
</div>
<div class="reviewdock"><button class="round secondary" id="prev" aria-label="Previous prototype">← Prev</button><button class="round" id="notesBtn">Review notes</button><button class="round secondary" id="next" aria-label="Next prototype">Next →</button></div>
<div class="drawerback" id="drawerback" aria-hidden="true">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="notesTitle">
    <div class="handle"></div>
    <div class="drawerhead"><div><div class="eyebrow">Saved on this device</div><h2 id="notesTitle">Notes — Ocho</h2></div><button class="close" id="closeDrawer" aria-label="Close review notes">×</button></div>
    <div class="notes"><div class="noteMeta"><span id="noteConcept">Quiet Campfire</span><span class="saved" id="savedState">Saved</span></div><textarea id="noteText" placeholder="What do you like? What would you change? Which parts should make the final UX?"></textarea></div>
    <div class="draweractions"><button id="clearNote">Clear this note</button><button class="primary" id="copySummary">Copy all 4 notes for ChatGPT</button></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const prototypes={
 ocho:{index:0,label:'Ocho',concept:'Quiet Campfire',desc:'Quiet Campfire — calm, human, low-cognitive-load messaging.',url:'./01-ocho-quiet-campfire/index.html'},
 jordan:{index:1,label:'Jordan',concept:'Message Switchboard',desc:'Message Switchboard — explicit system rules, filters, search and transparent organisation.',url:'./02-jordan-message-switchboard/index.html'},
 loren:{index:2,label:'Loren',concept:'Flow Through',desc:'Flow Through — direct manipulation, swipe acceleration and spatial continuity.',url:'./03-loren-flow-through/index.html'},
 christian:{index:3,label:'Christian',concept:'Native Power Inbox',desc:'Native Power Inbox — familiar defaults with optional power-user controls and native polish.',url:'./04-christian-native-power/index.html'}
};
const keys=Object.keys(prototypes);let active='ocho';
const tabs=[...document.querySelectorAll('.tab')],frames=[...document.querySelectorAll('.frame')];
const progress=document.getElementById('progress'),concept=document.getElementById('concept'),openFull=document.getElementById('openFull');
const drawerback=document.getElementById('drawerback'),notesTitle=document.getElementById('notesTitle'),noteConcept=document.getElementById('noteConcept'),noteText=document.getElementById('noteText'),savedState=document.getElementById('savedState'),toast=document.getElementById('toast');
function storageKey(key){return 'designlab-xplorer-messages-review-'+key}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1700)}
function setActive(key,{updateHash=true}={}){if(!prototypes[key])return;active=key;const p=prototypes[key];tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.key===key)));frames.forEach(f=>f.classList.toggle('active',f.dataset.key===key));progress.textContent=`${p.index+1} of 4`;concept.textContent=p.desc;openFull.href=p.url;notesTitle.textContent=`Notes — ${p.label}`;noteConcept.textContent=p.concept;noteText.value=localStorage.getItem(storageKey(key))||'';if(updateHash)history.replaceState(null,'','#'+key);tabs.find(t=>t.dataset.key===key)?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
tabs.forEach(t=>t.addEventListener('click',()=>setActive(t.dataset.key)));
document.getElementById('prev').addEventListener('click',()=>setActive(keys[(prototypes[active].index+3)%4]));
document.getElementById('next').addEventListener('click',()=>setActive(keys[(prototypes[active].index+1)%4]));
function openDrawer(){const p=prototypes[active];notesTitle.textContent=`Notes — ${p.label}`;noteConcept.textContent=p.concept;noteText.value=localStorage.getItem(storageKey(active))||'';drawerback.classList.add('open');drawerback.setAttribute('aria-hidden','false');setTimeout(()=>noteText.focus(),0)}
function closeDrawer(){drawerback.classList.remove('open');drawerback.setAttribute('aria-hidden','true')}
document.getElementById('notesBtn').addEventListener('click',openDrawer);document.getElementById('closeDrawer').addEventListener('click',closeDrawer);drawerback.addEventListener('click',e=>{if(e.target===drawerback)closeDrawer()});
noteText.addEventListener('input',()=>{savedState.textContent='Saving…';clearTimeout(noteText.t);noteText.t=setTimeout(()=>{localStorage.setItem(storageKey(active),noteText.value);savedState.textContent='Saved'},250)});
document.getElementById('clearNote').addEventListener('click',()=>{noteText.value='';localStorage.removeItem(storageKey(active));savedState.textContent='Saved';showToast('Note cleared')});
document.getElementById('copySummary').addEventListener('click',async()=>{const sections=keys.map((k,i)=>{const p=prototypes[k];const text=(localStorage.getItem(storageKey(k))||'').trim()||'[No notes yet]';return `${i+1}. ${p.label} — ${p.concept}\n${text}`});const summary=`Xplorer Messages UX tournament review\n\n${sections.join('\n\n')}\n\nPlease use these notes to help synthesize the final UX. Do not begin visual design until I approve the synthesized UX.`;try{await navigator.clipboard.writeText(summary);showToast('All 4 notes copied')}catch{const ta=document.createElement('textarea');ta.value=summary;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('All 4 notes copied')}});
document.addEventListener('keydown',e=>{if(drawerback.classList.contains('open')){if(e.key==='Escape')closeDrawer();return}if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});
window.addEventListener('hashchange',()=>setActive(location.hash.slice(1),{updateHash:false}));
setActive(prototypes[location.hash.slice(1)]?location.hash.slice(1):'ocho',{updateHash:false});
</script>
</body>
</html>
