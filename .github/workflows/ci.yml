# CI for DesignLab itself.
#
# Note: this is not the workflow DesignLab generates for target applications —
# see src/builds/workflow-generator.ts and docs/apk-pipeline.md for those.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The integration suite creates real git repositories in a temp
      # directory, so git needs an identity available to it.
      - name: Configure git identity
        run: |
          git config --global user.name "DesignLab CI"
          git config --global user.email "ci@designlab.local"
          git config --global init.defaultBranch main

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  acceptance:
    name: V1 acceptance flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Configure git identity
        run: |
          git config --global user.name "DesignLab CI"
          git config --global user.email "ci@designlab.local"
          git config --global init.defaultBranch main

      - name: Build
        run: npm run build

      # Drives the real CLI end to end against a temporary fixture app, with
      # the deterministic agent backend. No credentials, no network, no tokens.
      - name: Acceptance run
        run: node scripts/acceptance.mjs
