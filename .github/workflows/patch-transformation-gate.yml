name: Patch Design Transformation gate

on:
  push:
    branches:
      - designlab-2.0
    paths:
      - 'scripts/patch-transformation-gate.mjs'
      - '.github/workflows/patch-transformation-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: designlab-2.0
          fetch-depth: 0
      - name: Apply Design Transformation runtime patch
        run: node scripts/patch-transformation-gate.mjs
      - name: Verify patch compiles and tests
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit transformation gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DesignLab CI"
          git config user.email "ci@designlab.local"
          git add src/tournaments/xplorer-challenger-b.ts tests/unit/xplorer-challenger-b.test.ts scripts/acceptance.mjs knowledge/state/DESIGNLAB_STATE.json
          git commit -m "Require creative independence from challenger two"
          git push origin HEAD:designlab-2.0
