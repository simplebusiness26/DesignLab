name: Apply Round 2 Prototype

on:
  push:
    branches: [designlab-2.0]
    paths:
      - '.github/workflows/apply-round2-prototype.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: designlab-2.0
      - name: Reconstruct and verify Christian Round 2
        env:
          PAYLOAD: 
          EXPECTED_SHA: 3fa9242e62b4f148d27a40de937e077a065798458cc59a29bb7d2e1e31837e4a
        run: |
          python3 - <<'PY'
          import os, base64, gzip, hashlib
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          got = hashlib.sha256(data).hexdigest()
          assert got == os.environ['EXPECTED_SHA'], (got, os.environ['EXPECTED_SHA'])
          path = Path('prototypes/xplorer-messages/04-christian-native-power/index.html')
          path.write_bytes(data)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA']
          print('PASS Christian exact SHA:', got)
          PY
      - name: Commit Christian Round 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/xplorer-messages/04-christian-native-power/index.html
          git commit -m "ux: rebuild Christian Messages prototype for Round 2"
          git push origin HEAD:designlab-2.0
