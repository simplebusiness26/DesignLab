name: Apply Round 2 Prototype

on:
  push:
    branches: [designlab-2.0]
    paths:
      - '.github/workflows/apply-round2-prototype.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: designlab-2.0
      - name: Reconstruct and verify Loren Round 2
        env:
          PAYLOAD: 
          EXPECTED_SHA: ceef14eaf26892477da4e9e94ed0ebbb5f89d7446e016d530c54f42211004736
        run: |
          python3 - <<'PY'
          import os, base64, gzip, hashlib
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          got = hashlib.sha256(data).hexdigest()
          assert got == os.environ['EXPECTED_SHA'], (got, os.environ['EXPECTED_SHA'])
          path = Path('prototypes/xplorer-messages/03-loren-flow-through/index.html')
          path.write_bytes(data)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA']
          print('PASS Loren exact SHA:', got)
          PY
      - name: Commit Loren Round 2 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/xplorer-messages/03-loren-flow-through/index.html
          git commit -m "ux: rebuild Loren Messages prototype for Round 2"
          git push origin HEAD:designlab-2.0
