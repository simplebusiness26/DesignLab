name: Build Standalone Xplorer Messages UX Review

on:
  push:
    branches: [designlab-2.0]
    paths:
      - '.github/workflows/build-standalone-xplorer-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: designlab-2.0

      - name: Build single self-contained review HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html

          root = Path('prototypes/xplorer-messages')
          items = [
              ('Ocho', 'Quiet Campfire', root/'01-ocho-quiet-campfire/index.html'),
              ('Jordan', 'Message Switchboard', root/'02-jordan-message-switchboard/index.html'),
              ('Loren', 'Flow Through', root/'03-loren-flow-through/index.html'),
              ('Christian', 'Native Power Inbox', root/'04-christian-native-power/index.html'),
          ]

          frames = []
          tabs = []
          for i, (name, title, path) in enumerate(items):
              content = path.read_text(encoding='utf-8')
              safe = html.escape(content, quote=True)
              tabs.append(f'<button class="tab" data-i="{i}" aria-selected="{"true" if i == 0 else "false"}">{name}</button>')
              frames.append(f'<iframe class="frame {"active" if i == 0 else ""}" data-i="{i}" title="{name} — {title}" srcdoc="{safe}"></iframe>')

          doc = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8" />
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
          <title>DesignLab 2.0 — Xplorer Messages UX Review Standalone</title>
          <style>
          :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--ink:#17181a;--muted:#6f737b;--line:#dfe2e6;--bg:#eef0f3}
          *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}body{overflow:hidden}.shell{height:100dvh;display:flex;flex-direction:column}.bar{flex:0 0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:max(9px,env(safe-area-inset-top)) 9px 8px}.eyebrow{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{font-size:17px;font-weight:800;margin-top:2px}.tabs{display:flex;gap:6px;overflow:auto;margin-top:9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#fff;color:#555a62;border-radius:11px;padding:8px 10px;white-space:nowrap;font:inherit;font-size:12px;font-weight:760}.tab[aria-selected="true"]{background:#17181a;color:#fff;border-color:#17181a}.stage{position:relative;flex:1;min-height:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.frame.active{display:block}.foot{font-size:10px;color:var(--muted);margin-top:6px}.note{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;border:0;background:#17181a;color:white;border-radius:999px;padding:10px 12px;font:inherit;font-size:11px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18)}.drawerback{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;display:none}.drawerback.open{display:block}.drawer{position:absolute;left:0;right:0;bottom:0;background:white;border-radius:20px 20px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom))}.drawer h2{font-size:16px;margin:0 0 8px}.drawer textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;resize:vertical}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font:inherit;font-weight:750}.actions .primary{background:#17181a;color:#fff;border-color:#17181a}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
          </style></head><body><div class="shell"><header class="bar"><div class="eyebrow">DesignLab 2.0 · UX tournament</div><div class="title">Xplorer Messages — standalone review</div><div class="tabs">__TABS__</div><div class="foot">All four prototypes are embedded inside this one file. No internet or extra files required.</div></header><main class="stage">__FRAMES__</main></div><button class="note" id="noteBtn">Review note</button><div class="drawerback" id="drawerBack"><div class="drawer"><h2 id="noteTitle">Review note</h2><textarea id="notes" placeholder="What do you like, dislike, or want combined from this version?"></textarea><div class="actions"><button id="close">Close</button><button class="primary" id="copy">Copy all notes</button></div></div></div><script>
          const names=['Ocho','Jordan','Loren','Christian']; let active=0; const tabs=[...document.querySelectorAll('.tab')],frames=[...document.querySelectorAll('.frame')];
          function setActive(i){active=i;tabs.forEach((b,n)=>b.setAttribute('aria-selected',String(n===i)));frames.forEach((f,n)=>f.classList.toggle('active',n===i));document.getElementById('notes').value=localStorage.getItem('xplorer-review-'+i)||'';document.getElementById('noteTitle').textContent=names[i]+' review note'}
          tabs.forEach((b,i)=>b.addEventListener('click',()=>setActive(i)));
          const back=document.getElementById('drawerBack'),ta=document.getElementById('notes');
          document.getElementById('noteBtn').onclick=()=>{setActive(active);back.classList.add('open')};
          document.getElementById('close').onclick=()=>back.classList.remove('open');
          ta.addEventListener('input',()=>localStorage.setItem('xplorer-review-'+active,ta.value));
          document.getElementById('copy').onclick=async()=>{const text=names.map((n,i)=>n+':\n'+(localStorage.getItem('xplorer-review-'+i)||'(no note)')).join('\n\n');try{await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='Copied';setTimeout(()=>document.getElementById('copy').textContent='Copy all notes',1200)}catch(e){ta.value=text;ta.select()}};
          setActive(0);
          </script></body></html>'''
          doc = doc.replace('__TABS__', ''.join(tabs)).replace('__FRAMES__', ''.join(frames))
          out = root/'Xplorer-Messages-UX-Review-Standalone.html'
          out.write_text(doc, encoding='utf-8')
          print(f'Built {out} ({out.stat().st_size} bytes) with {len(frames)} embedded prototypes')
          PY

      - name: Verify standalone contains all four embedded prototypes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/xplorer-messages/Xplorer-Messages-UX-Review-Standalone.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('srcdoc=') == 4, s.count('srcdoc=')
          for term in ['Quiet Campfire','Message Switchboard','Flow Through','Native Power Inbox']:
              assert term in s, term
          assert '../' not in s
          print('PASS: 4 embedded prototypes, no relative external prototype paths')
          PY

      - name: Commit standalone review file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/xplorer-messages/Xplorer-Messages-UX-Review-Standalone.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: add self-contained Xplorer Messages UX review"
            git push origin HEAD:designlab-2.0
          fi

      - name: Package single-file download
        run: |
          mkdir -p standalone-download
          cp prototypes/xplorer-messages/Xplorer-Messages-UX-Review-Standalone.html standalone-download/index.html
          cd standalone-download
          zip -9 ../Xplorer-Messages-UX-Review-Standalone.zip index.html

      - name: Upload standalone download artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-Messages-UX-Review-Standalone
          path: Xplorer-Messages-UX-Review-Standalone.zip
          retention-days: 30
