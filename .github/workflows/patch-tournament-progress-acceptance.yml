name: Patch Tournament B acceptance progression

on:
  push:
    branches:
      - designlab-2.0
    paths:
      - '.github/workflows/patch-tournament-progress-acceptance.yml'
      - 'scripts/patch-acceptance-progression.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: designlab-2.0
          fetch-depth: 0
      - name: Make Tournament B acceptance state-aware
        run: node scripts/patch-acceptance-progression.mjs
      - name: Commit acceptance progression fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DesignLab CI"
          git config user.email "ci@designlab.local"
          git add scripts/acceptance.mjs
          if git diff --cached --quiet; then
            echo "Acceptance progression already patched."
          else
            git commit -m "Make Tournament B acceptance progression-aware"
            git push origin HEAD:designlab-2.0
          fi
