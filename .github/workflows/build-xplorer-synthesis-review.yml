name: Build Xplorer Messages Synthesis Review

on:
  push:
    branches: [designlab-2.0]
    paths:
      - '.github/workflows/build-xplorer-synthesis-review.yml'
      - 'prototypes/xplorer-messages/synthesis/01-warm-flow/index.html'
      - 'prototypes/xplorer-messages/synthesis/02-fluid-explorer/index.html'
      - 'prototypes/xplorer-messages/synthesis/03-living-inbox/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: designlab-2.0

      - name: Build self-contained three-way synthesis review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html

          root = Path('prototypes/xplorer-messages/synthesis')
          items = [
              ('A', 'Warm Flow', 'Ocho first · Loren second · Jordan support', root/'01-warm-flow/index.html'),
              ('B', 'Fluid Explorer', 'Loren first · Ocho second · Jordan support', root/'02-fluid-explorer/index.html'),
              ('C', 'Living Inbox', 'Jordan first · Ocho + Loren humanise it', root/'03-living-inbox/index.html'),
          ]

          controls, labels, frames, selectors = [], [], [], []
          for i, (letter, name, blend, path) in enumerate(items):
              source = path.read_text(encoding='utf-8')
              safe = html.escape(source, quote=True)
              checked = ' checked' if i == 0 else ''
              controls.append(f'<input class="switch" type="radio" name="concept" id="concept-{i}"{checked}>')
              labels.append(f'<label class="tab" for="concept-{i}"><b>{letter} · {name}</b><span>{blend}</span></label>')
              frames.append(f'<iframe class="frame frame-{i}" title="{name}" srcdoc="{safe}"></iframe>')
              selectors.append(f'#concept-{i}:checked ~ .shell .tab[for="concept-{i}"]{{background:#17181a;color:#fff;border-color:#17181a}}')
              selectors.append(f'#concept-{i}:checked ~ .shell .tab[for="concept-{i}"] span{{color:#c9cbd0}}')
              selectors.append(f'#concept-{i}:checked ~ .shell .frame-{i}{{display:block}}')

          doc = '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DesignLab — Xplorer Messages Synthesis Tournament</title><style>
          :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#17181a;--muted:#6f737b;--line:#dfe2e6;--bg:#eef0f3}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}body{overflow:hidden}.switch{position:fixed;left:-9999px;opacity:0;pointer-events:none}.shell{height:100dvh;display:flex;flex-direction:column}.bar{flex:0 0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:max(9px,env(safe-area-inset-top)) 9px 8px}.eyebrow{font-size:9px;color:var(--muted);font-weight:850;letter-spacing:.09em;text-transform:uppercase}.title{font-size:16px;font-weight:850;margin-top:2px}.tabs{display:flex;gap:6px;overflow:auto;margin-top:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:154px;border:1px solid var(--line);background:#fff;color:#555a62;border-radius:11px;padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.tab b{font-size:11px;font-weight:850}.tab span{font-size:8px;color:#858991;margin-top:2px;font-weight:650}.tab:active{transform:scale(.985)}.stage{position:relative;flex:1;min-height:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.foot{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.35}.help{font-weight:800;color:#45484e}__SELECTORS__@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
          </style></head><body>__CONTROLS__<div class="shell"><header class="bar"><div class="eyebrow">DesignLab · Final UX synthesis tournament</div><div class="title">Xplorer Messages — choose the blend that feels right</div><div class="tabs">__LABELS__</div><div class="foot"><span class="help">Tap A, B or C to switch.</span> The outer tabs use HTML/CSS only for Android reliability. Each candidate is fully interactive inside this one file.</div></header><main class="stage">__FRAMES__</main></div></body></html>'''
          doc = (doc.replace('__CONTROLS__', ''.join(controls))
                    .replace('__LABELS__', ''.join(labels))
                    .replace('__FRAMES__', ''.join(frames))
                    .replace('__SELECTORS__', ''.join(selectors)))
          standalone = root/'Xplorer-Messages-Synthesis-Review.html'
          index = root/'index.html'
          standalone.write_text(doc, encoding='utf-8')
          index.write_text(doc, encoding='utf-8')
          print(f'Built {standalone} ({standalone.stat().st_size} bytes)')
          PY

      - name: Verify three-way review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('prototypes/xplorer-messages/synthesis')
          a=(root/'Xplorer-Messages-Synthesis-Review.html').read_text(encoding='utf-8')
          b=(root/'index.html').read_text(encoding='utf-8')
          assert a == b
          assert a.count('srcdoc=') == 3
          assert a.count('type="radio"') == 3
          outer=a.split('srcdoc=',1)[0]
          assert 'querySelectorAll' not in outer
          for term in ['Warm Flow','Fluid Explorer','Living Inbox','Synthesis A · Warm Flow','Synthesis B · Fluid Explorer','Synthesis C · Living Inbox']:
              assert term in a, term
          assert '../' not in a
          print('PASS: 3 embedded candidates + CSS-only outer tabs + identical index/standalone')
          PY

      - name: Commit generated review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/xplorer-messages/synthesis/index.html prototypes/xplorer-messages/synthesis/Xplorer-Messages-Synthesis-Review.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "ux: build three-way Xplorer Messages synthesis review"
            git push origin HEAD:designlab-2.0
          fi

      - name: Prepare artifact
        run: |
          mkdir -p synthesis-download
          cp prototypes/xplorer-messages/synthesis/index.html synthesis-download/index.html

      - name: Upload synthesis artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-Messages-Synthesis-Three-Way
          path: synthesis-download/index.html
          retention-days: 30
